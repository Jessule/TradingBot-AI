<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estudio Programación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0d12;--surface:#111620;--surface2:#161c28;--border:#1e2a3a;
  --accent:#00d4a0;--accent-dim:rgba(0,212,160,.12);--accent-line:rgba(0,212,160,.3);
  --red:#ff4d6a;--red-dim:rgba(255,77,106,.12);--yellow:#f5c542;--yellow-dim:rgba(245,197,66,.1);--purple:#9d7bff;
  --text:#e8edf5;--text2:#7a8fa8;--text3:#3d5068;
  --font:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1200px 600px at 50% -10%,rgba(0,212,160,.06),transparent),var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;min-height:100vh}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.02rem;letter-spacing:-.4px;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orb{width:14px;height:14px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 30% 30%,#6ffdd6,var(--accent));box-shadow:0 0 14px var(--accent)}
.wallet{display:flex;align-items:center;gap:8px;background:var(--accent-dim);border:1px solid var(--accent-line);padding:5px 12px;border-radius:30px;flex-shrink:0}
.wallet .amt{font-family:var(--mono);font-weight:700;color:var(--accent)}
.wallet .lbl{font-size:.62rem;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--bg);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex-shrink:0;background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.82rem;cursor:pointer;transition:all .15s}
.nav button:hover{border-color:var(--accent);color:var(--accent)}
.nav button.on{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent)}
main{max-width:920px;margin:0 auto;padding:20px 16px 80px}
h2{font-size:1.2rem;font-weight:700;letter-spacing:-.3px;margin:22px 0 10px}
.mut{color:var(--text2);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
/* hero */
.hero{text-align:center;padding:30px 0 10px}
.hero h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:700;letter-spacing:-1px;line-height:1.1}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--text2);max-width:480px;margin:12px auto 0;font-size:.95rem}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:24px 0 10px}
.big-btn{border:none;cursor:pointer;font-weight:700;padding:15px 28px;border-radius:14px;font-size:1.02rem;transition:transform .12s,box-shadow .2s}
.big-btn.play{background:linear-gradient(135deg,var(--accent),#06b386);color:#04150f;box-shadow:0 8px 30px rgba(0,212,160,.35)}
.big-btn.alt{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.big-btn:active{transform:scale(.96)}
.big-btn:disabled{opacity:.4;cursor:default}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.pill{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px 14px;text-align:center;min-width:92px}
.pill .l{font-size:.58rem;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.pill .v{font-family:var(--mono);font-weight:700;font-size:1.1rem}
.pill .v.g{color:var(--accent)}.pill .v.y{color:var(--yellow)}.pill .v.r{color:var(--red)}.pill .v.p{color:var(--purple)}
.lvl{max-width:420px;margin:18px auto 0}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--yellow));border-radius:6px;transition:width .3s}
/* mission cards */
.mission{cursor:pointer;text-align:left;transition:border-color .15s,transform .12s,box-shadow .2s;display:flex;flex-direction:column;gap:6px}
.mission:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-line),0 8px 24px rgba(0,212,160,.08);transform:translateY(-2px)}
.mission b{font-size:.95rem;line-height:1.25}
.mission .meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;color:var(--text2)}
.mission .best{color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px;margin:6px 0 0}
.toggle{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:.88rem}
.toggle input{accent-color:var(--accent);margin-top:4px;width:16px;height:16px}
/* play */
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.exit{background:var(--red-dim);border:1px solid rgba(255,77,106,.35);color:var(--red);border-radius:10px;padding:8px 14px;font-weight:700;font-size:.8rem;cursor:pointer}
.timebar{height:5px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-bottom:16px}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--accent),var(--yellow))}
.timebar i.low{background:var(--red)}
.q{font-size:clamp(1.05rem,3.4vw,1.3rem);font-weight:600;letter-spacing:-.2px;line-height:1.35;margin-bottom:14px;text-wrap:balance}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.opt .k{font-family:var(--mono);font-weight:700;font-size:.78rem;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:7px;min-width:26px;height:26px;display:grid;place-items:center;flex-shrink:0}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(2px)}
.opt.sel{border-color:var(--purple);background:rgba(157,123,255,.1)}
.opt.ok{border-color:var(--accent);background:var(--accent-dim);box-shadow:0 0 18px rgba(0,212,160,.2)}
.opt.ok .k{color:#04150f;background:var(--accent);border-color:var(--accent)}
.opt.ko{border-color:var(--red);background:var(--red-dim);animation:shake .35s}
.opt.ko .k{color:#fff;background:var(--red);border-color:var(--red)}
.opt:disabled{cursor:default;color:var(--text)}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{margin-top:6px;padding:13px 14px;border-radius:12px;border:1px solid;font-size:.93rem}
.fb.ok{background:var(--accent-dim);border-color:var(--accent-line)}
.fb.ko{background:var(--red-dim);border-color:rgba(255,77,106,.35)}
.fb b.t{font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:1px}
.fb.ok b.t{color:var(--accent)}.fb.ko b.t{color:var(--red)}
.pop{position:fixed;pointer-events:none;font-family:var(--mono);font-weight:700;color:var(--accent);text-shadow:0 0 10px rgba(0,212,160,.6);animation:floatUp .9s ease-out forwards;z-index:50}
@keyframes floatUp{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-46px) scale(1.3)}}
/* result */
.res{text-align:center;padding:10px 0}
.ring{width:150px;height:150px;margin:6px auto}
.ring text{font-family:var(--mono);font-weight:700}
.stars{font-size:1.6rem;letter-spacing:6px;margin:6px 0}
.rev{text-align:left;margin-top:12px}
.rev .tit{font-weight:600;margin-bottom:8px}
/* cards */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:20px;padding:6px 12px;font-size:.8rem;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent)}
.flash{perspective:1200px;margin:14px 0}
.flip{position:relative;height:280px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.8,.3,1);cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--border);overflow:auto}
.front{background:linear-gradient(160deg,var(--surface2),var(--surface));font-size:clamp(1.2rem,4vw,1.6rem);font-weight:700;letter-spacing:-.4px;box-shadow:0 0 0 1px var(--accent-line) inset}
.back{background:linear-gradient(160deg,#0f2a26,var(--surface));transform:rotateY(180deg);font-size:1.02rem;line-height:1.55;border-color:var(--accent-line)}
.hint{font-family:var(--mono);font-size:.68rem;color:var(--text3);margin-top:12px;font-weight:500;letter-spacing:1px;text-transform:uppercase}
.sec{font-family:var(--mono);font-size:.66rem;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;font-weight:700}
/* dev */
textarea{width:100%;min-height:150px;padding:13px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font:inherit;resize:vertical}
textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-dim)}
.kw{display:inline-block;margin:3px 5px 3px 0;padding:4px 11px;border-radius:14px;font-size:.82rem;font-weight:600;border:1px solid var(--border)}
.kw.has{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent)}
.kw.no{background:var(--red-dim);border-color:rgba(255,77,106,.35);color:var(--red)}
.model-ans{background:var(--yellow-dim);border:1px solid rgba(245,197,66,.3);padding:13px 14px;border-radius:12px;margin-top:12px;white-space:pre-line;font-size:.93rem}
.mini{background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:10px;padding:9px 14px;font-weight:600;font-size:.85rem;cursor:pointer}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.hist p{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.8rem;color:var(--text2);padding:5px 0;border-bottom:1px solid var(--border)}

/* ===== FX ===== */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.14;animation:drift 22s ease-in-out infinite alternate}
.bgfx i:nth-child(1){background:var(--accent);left:-12vmax;top:-12vmax}
.bgfx i:nth-child(2){background:var(--purple);right:-16vmax;top:30vh;animation-duration:28s;animation-delay:-8s}
.bgfx i:nth-child(3){background:#1e6fff;left:20vw;bottom:-26vmax;animation-duration:34s;animation-delay:-14s;opacity:.1}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:55}
#app>*{animation:rise .38s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.opt{animation:rise .4s cubic-bezier(.2,.8,.3,1) both}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
.opt.ok{animation:pulseOk .7s}
@keyframes pulseOk{0%{box-shadow:0 0 0 0 rgba(0,212,160,.7)}100%{box-shadow:0 0 0 20px rgba(0,212,160,0)}}
.shake{animation:shake .38s!important}
.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.22)}}
.hero h1 span{background:linear-gradient(90deg,#00d4a0,#6ffdd6,#9d7bff,#00d4a0);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:220% 0}}
.big-btn.play{position:relative;overflow:hidden}
.big-btn.play::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.big-btn:hover{transform:translateY(-2px)}
.banner{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:60}
.banner div{font-family:var(--mono);font-weight:700;font-size:clamp(2rem,11vw,4.2rem);color:var(--accent);text-shadow:0 0 30px var(--accent);animation:banner 1.5s ease-out forwards;text-align:center;line-height:1.1}
.banner small{display:block;font-size:.3em;color:var(--yellow);text-shadow:none;letter-spacing:3px;margin-top:8px}
@keyframes banner{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.18)}65%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-34px) scale(1.06)}}
.star{display:inline-block;animation:starpop .55s cubic-bezier(.2,1.5,.4,1) both;color:var(--yellow);text-shadow:0 0 14px rgba(245,197,66,.6)}
@keyframes starpop{0%{transform:scale(0) rotate(-120deg);opacity:0}100%{transform:scale(1);opacity:1}}
.fly{animation:fly .4s ease-in forwards!important}
@keyframes fly{to{transform:translateX(110%) rotate(14deg);opacity:0}}
.timebar i.low{animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.45}}
.snd{background:var(--surface2);border:1px solid var(--border);border-radius:10px;width:38px;height:34px;cursor:pointer;font-size:1rem}
.snd:hover{border-color:var(--accent)}
.flame{display:inline-block;animation:flick .9s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.18) rotate(-6deg)}}
.orb{animation:orbpulse 2.4s ease-in-out infinite}
@keyframes orbpulse{50%{box-shadow:0 0 22px var(--accent),0 0 6px #6ffdd6}}

/* ===== RESUMEN ===== */
.emo{font-size:3.4rem;line-height:1;display:inline-block;animation:emobounce 1.8s ease-in-out infinite}
@keyframes emobounce{50%{transform:translateY(-8px) rotate(-6deg) scale(1.08)}}
.fl{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.fc{position:relative;min-height:96px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;font-size:.93rem;line-height:1.4;transition:border-color .15s,transform .12s}
.fc:hover{border-color:var(--accent);transform:translateY(-2px)}
.fc .ff{font-weight:700;display:flex;gap:8px;align-items:center}
.fc .ff::after{content:"toca";font-family:var(--mono);font-size:.6rem;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-left:auto}
.fc .fb2{display:none}
.fc.on{background:linear-gradient(160deg,#0f2a26,var(--surface));border-color:var(--accent-line);animation:flipin .4s}
.fc.on .ff{display:none}.fc.on .fb2{display:block}
@keyframes flipin{from{transform:rotateX(80deg);opacity:.2}to{transform:none;opacity:1}}
.trick{background:linear-gradient(135deg,rgba(245,197,66,.1),var(--surface));border-color:rgba(245,197,66,.3);margin-top:16px;font-size:1rem}
.ord{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.ordb{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-weight:600;font-size:.9rem;cursor:pointer;transition:all .15s}
.ordb:hover:not(:disabled){border-color:var(--purple)}
.ordb.good{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);animation:pulseOk .6s}
.ordb.bad{animation:shake .35s;border-color:var(--red)}
.ordb .n{font-family:var(--mono);background:var(--accent);color:#04150f;border-radius:6px;padding:0 6px;margin-right:6px;font-size:.78rem}
.vf{margin-bottom:10px}
.vf .row{margin-top:10px}
.vf .mini.right{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.vf .mini.wrong{background:var(--red-dim);border-color:var(--red);color:var(--red);animation:shake .35s}
.vfb{margin-top:8px;font-size:.9rem}
.sumdone{margin:20px 0 6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.big-btn{padding:14px 22px}.flip{height:300px}}
</style>
</head>
<body>
<div class="bgfx"><i></i><i></i><i></i></div>
<div class="topbar">
  <div class="brand"><div class="orb"></div><span id="brand"></span></div>
  <div class="row" style="gap:8px;flex-wrap:nowrap"><button class="snd" id="snd" aria-label="Activar o silenciar sonido">🔊</button><div class="wallet"><span class="lbl" id="lvl">Nv 1</span><span class="amt" id="xp">0 XP</span></div></div>
</div>
<nav class="nav" id="nav">
  <button data-v="home" class="on">Inicio</button><button data-v="sum">📖 Resumen</button><button data-v="tests">Tests</button><button data-v="cards">Tarjetas</button><button data-v="dev">Desarrollo</button><button data-v="stats">Progreso</button>
</nav>
<main id="app"></main>

<script>
const APP={title:"Estudio Programación",short:"Programación",h1:"Programación <span>y algoritmos</span>",sub:"Programación, IA y Robótica · Tema 1. Tests, tarjetas y preguntas de desarrollo. Gana XP, sube de nivel y mantén la racha.",key:"estudioProg"};
// Q(pregunta, respuesta correcta, [3 incorrectas], explicación)
const Q=(q,ok,bad,why)=>({q,ok,bad,why});

const MODELS=[
{name:"Modelo 1",qs:[
Q("Un lenguaje de programación es…","Un lenguaje que sirve para describir un conjunto de acciones que deben ser ejecutadas por las máquinas",["Un idioma para hablar con personas","Un programa que repara ordenadores","Un tipo de hardware"],"Con él los seres humanos dan instrucciones a un equipo informático."),
Q("Los lenguajes visuales de programación se basan en…","Bloques gráficos con funciones específicas que se ensamblan",["Escribir código con sintaxis estricta","Código binario","Pseudocódigo en papel"],"Ejemplos: Scratch y App Inventor."),
Q("¿Cuál es un lenguaje de programación textual?","Python",["Scratch","App Inventor","MakeCode con bloques"],"Otros: Processing, C++ y Java."),
Q("El código fuente es…","Las instrucciones escritas en un lenguaje de programación textual que el ordenador debe ejecutar",["El archivo en ceros y unos","Una herramienta gráfica","Un tipo de licencia"],"Debe traducirse a lenguaje máquina."),
Q("Un compilador es…","Un traductor que convierte el código fuente en lenguaje máquina",["Un editor de bloques","Un sistema operativo","Un diagrama de flujo"],"El resultado es el código objeto."),
Q("Un algoritmo es…","Una secuencia ordenada de pasos que resuelven un problema en un tiempo finito",["Un programa ya traducido","Un lenguaje de bajo nivel","Un dato numérico"],"Debe ser concreto, finito y ordenado."),
Q("El pseudocódigo es…","Un lenguaje hecho para que lo entiendan los humanos y no las máquinas, por lo que no se puede ejecutar",["Un lenguaje que entiende la CPU","Código binario","Un tipo de licencia"],"Sirve para detectar errores en los algoritmos y depurarlos."),
Q("Una estructura iterativa o repetitiva…","Repite una serie de instrucciones mediante bucles",["Ejecuta instrucciones solo si se cumple una condición","Ejecuta instrucciones una tras otra sin repetir","Divide el programa en archivos"],"Los bucles marcan el inicio y el fin de la repetición."),
Q("El número decimal 33 en binario es…","100001",["110011","10001","100010"],"33 = 32 + 1 = 2⁵ + 2⁰."),
Q("En la tabla de verdad del operador AND, el resultado es 1…","Solo cuando las dos entradas valen 1",["Cuando alguna entrada vale 1","Cuando las dos entradas valen 0","Siempre"],"Es el producto lógico."),
Q("Una app para móviles creada con App Inventor se basa en la programación…","Orientada a eventos",["Estructurada únicamente","Binaria","De bajo nivel"],"Las acciones se ejecutan cuando el usuario provoca un evento."),
Q("El software libre se caracteriza por…","Poder usarse, copiarse, modificarse y redistribuirse libremente",["Ser siempre de pago","Tener el código oculto","No poder modificarse"],"Ejemplos: LibreOffice, GIMP y Audacity."),
]},
{name:"Modelo 2",qs:[

Q("La ordenación por selección consiste en…","Comparar los datos de dos en dos desde la izquierda, colocando el menor a la izquierda, y repetir hasta ordenarlos",["Elegir un dato al azar y dividir la lista","Buscar el dato central","Revisar uno a uno"],"No es muy eficiente."),
Q("¿Por qué la ordenación por selección no es muy eficiente?","Porque requiere muchas comparaciones entre datos",["Porque es muy rápida","Porque no ordena","Porque usa pocos datos"],"Muchas comparaciones."),
Q("Ejemplo: ordenar 3, 1, 5, 7 y 6. Primer paso (comparar 3 y 1):","Se colocan así: 1, 3",["Se colocan así: 3, 1","No se modifica el orden","Se elimina el 3"],"El menor a la izquierda."),
Q("Ejemplo: ordenar 3, 1, 5, 7 y 6. Al comparar 7 y 6…","Se colocan así: 6, 7",["No se modifican","Se colocan así: 7, 6","Se elimina el 7"],"Lista ordenada: 1, 3, 5, 6, 7."),
Q("La lista ordenada final del ejemplo es…","1, 3, 5, 6, 7",["1, 3, 5, 7, 6","3, 1, 5, 6, 7","7, 6, 5, 3, 1"],"Orden creciente."),
Q("La ordenación rápida consiste en…","Escoger un dato al azar y colocar a su izquierda los menores y a su derecha los mayores, repitiendo en cada grupo",["Comparar datos de dos en dos","Buscar un dato uno a uno","Eliminar datos"],"Forma dos grupos."),
Q("La ordenación rápida suele ser…","Más eficiente que la anterior porque requiere menos comparaciones",["Menos eficiente","Igual de eficiente","Imposible"],"Menos comparaciones."),
Q("La búsqueda secuencial consiste en…","Revisar uno por uno cada dato de la lista",["Comparar con el dato central","Ordenar primero","Elegir al azar"],"Se usa con datos no ordenados."),
Q("La búsqueda secuencial se usa con…","Un conjunto de datos no ordenados",["Un conjunto de datos ordenados","Solo números","Solo texto"],"No hay orden."),
Q("¿Por qué la búsqueda secuencial no es eficiente?","Porque requiere muchas comparaciones si el número de datos es elevado",["Porque no encuentra datos","Porque ordena","Porque es muy rápida"],"Recorre toda la lista."),
Q("La búsqueda binaria se utiliza…","Cuando la lista de datos está ordenada",["Cuando está desordenada","Solo con 2 datos","Con cualquier lista"],"Requiere orden."),
Q("En la búsqueda binaria se compara el valor buscado con…","El dato central de la lista",["El primer dato","El último dato","Un dato al azar"],"Descarta una mitad."),
Q("En la búsqueda binaria, si el valor buscado es mayor que el dato central…","Se eliminan todos los datos situados a la izquierda del valor central",["Se eliminan los de la derecha","Se empieza de nuevo","Se detiene la búsqueda"],"Se repite con los que quedan."),
Q("La búsqueda binaria es más eficiente porque…","Requiere un menor número de comparaciones que la secuencial",["Requiere más comparaciones","No necesita datos","No usa listas"],"Descarta la mitad cada vez."),
Q("Un subalgoritmo es…","Un algoritmo que permite realizar tareas particulares necesarias para que el algoritmo principal resuelva un problema",["Un algoritmo infinito","Un tipo de dato","Un compilador"],"Divide el problema."),
Q("Los subalgoritmos también se llaman…","Subrutinas, subprogramas o procedimientos",["Bucles","Operadores","Bits"],"En computación."),
Q("Dividir los algoritmos en subalgoritmos se basa en…","Las bases del pensamiento computacional",["La compilación","El código binario","Las licencias"],"Descomposición."),
Q("Utilizar subalgoritmos en un programa permite…","Depurar errores y comprobar el desarrollo del algoritmo principal de forma más eficaz",["Que el programa falle","Compilar más rápido","Evitar usar variables"],"Más fácil de depurar."),
Q("En el ejemplo de Scratch, «hablar» y «baile» son…","Procedimientos (subalgoritmos)",["Variables","Bucles infinitos","Licencias"],"Se definen aparte y se usan en el programa principal."),
]},
{name:"4 · Estructura de un programa, datos y PSeInt",qs:[
Q("Los lenguajes de alto nivel son…","Los que sirven para programar con un lenguaje adecuado al entendimiento de los seres humanos y no de las máquinas",["Los más próximos al hardware","Los que usa la CPU","Los que no existen"],"Se pueden dividir en visuales y textuales."),
Q("Los lenguajes de bajo nivel recibían ese nombre porque…","Están en el nivel más próximo a la arquitectura del hardware",["Son fáciles","Son visuales","Son los más modernos"],"Los primeros lenguajes."),
Q("Los lenguajes de alto nivel pueden ser…","Visuales (para aprender) o textuales (realidad para programar)",["Binarios u hexadecimales","Compilados únicamente","Libres únicamente"],"Dos tipos."),
Q("Un programa se divide en tres secciones:","Entrada de datos, procesado y salida de datos",["Inicio, bucle y fin","Código fuente, compilador y código objeto","Identificador, tipo y valor"],"Entrada, proceso, salida."),
Q("La entrada de datos incluye…","Las instrucciones que recogen datos de un dispositivo (temperatura, luz…)",["Las instrucciones que procesan","Los resultados enviados","El compilador"],"Primera sección."),
Q("El procesado incluye…","Las instrucciones que procesan los datos recogidos (calcular si hace frío o calor, mucha o poca luz…)",["Las que recogen datos","Las que muestran resultados","Las que compilan"],"Segunda sección."),
Q("La salida de datos o resultado incluye…","El envío de resultados a dispositivos de salida (encender un ventilador o una luz)",["La recogida de datos","El procesado","La traducción"],"Tercera sección."),
Q("Los datos son…","Las unidades de información que vamos a procesar",["Las instrucciones","Los resultados únicamente","Los programas"],"Se componen de identificador, tipo y valor."),
Q("El identificador de un dato es…","El nombre que le damos al dato para poder utilizarlo e identificarlo",["Su contenido","La naturaleza del dato","Su tamaño"],"Por ejemplo, «edad»."),
Q("El tipo de un dato…","Define la naturaleza de los datos (numérico, booleano, string, array…)",["Es el nombre del dato","Es el contenido del dato","Es la sección del programa"],"Por ejemplo, numérico."),
Q("El valor de un dato es…","El contenido del dato",["El nombre del dato","El tipo del dato","El lenguaje del dato"],"Por ejemplo, 13."),
Q("Un dato de tipo numérico puede ser…","Un número entero, real, etc.",["Solo texto","Solo verdadero/falso","Una tabla"],"Numérico."),
Q("Un dato booleano…","Solo admite valores verdadero o falso",["Admite cualquier número","Admite texto","Es una tabla"],"Dos valores."),
Q("Un dato de tipo string son…","Letras y otros caracteres",["Números enteros","Verdadero/falso","Filas y columnas"],"Texto."),
Q("Un dato de tipo array es…","Una estructura compuesta por filas y columnas",["Un número","Un texto","Un valor lógico"],"Colección de datos."),
Q("En «edad = 13»: ¿cuál es el identificador, el tipo y el valor?","edad, numérico, 13",["13, numérico, edad","numérico, edad, 13","edad, 13, numérico"],"Identificador, tipo, valor."),
Q("PSeInt es…","Una herramienta con un pseudolenguaje que permite representar algoritmos con diagramas de flujo o pseudocódigo y traducirlos de una forma a otra",["Un lenguaje visual","Un compilador de Python","Una licencia"],"Entorno más amigable."),
Q("PSeInt ofrece ayudas como…","Sugerencias, autocompletado e indentación",["Solo errores","Nada","Solo licencias"],"Mientras escribimos."),
Q("Cuando ejecutamos un programa en PSeInt…","Identifica los errores y ofrece sugerencias para corregirlos",["Borra el programa","Cambia el lenguaje","Genera licencias"],"Ayuda a depurar."),
Q("Los comentarios se escriben detrás del símbolo…","//",["#","$","%"],"No afectan al código."),
Q("Los comentarios en el código…","Son aclaraciones o recordatorios que no se ejecutan",["Se ejecutan siempre","Cambian el resultado","Se compilan en binario"],"Sirven para entender el código."),
Q("Ejecutar el algoritmo paso a paso sirve para…","Ver qué instrucciones se ejecutan y en qué orden, y cómo cambian los contenidos de las variables",["Compilar más rápido","Eliminar errores automáticamente","Ocultar el código"],"Depuración."),
]},
{name:"5 · Lenguaje binario, ASCII, RGB y hexadecimal",qs:[
Q("El lenguaje binario es…","El lenguaje de programación con el que nos comunicamos con los ordenadores, con los símbolos 0 y 1",["Un lenguaje visual","Un lenguaje con 10 dígitos","Un lenguaje con letras"],"Bits."),
Q("Los símbolos 0 y 1 del lenguaje binario se llaman…","Bits",["Bytes","Píxeles","Variables"],"Binary digit."),
Q("Un byte es…","Un conjunto de 8 bits",["Un bit","4 bits","16 bits"],"En informática se agrupan en bytes."),
Q("El sistema decimal utiliza…","Diez dígitos (0 al 9)",["Dos dígitos","Ocho dígitos","Dieciséis dígitos"],"Es el que usamos a diario."),
Q("Con un byte se pueden codificar…","256 caracteres diferentes (2⁸)",["8 caracteres","100 caracteres","64 caracteres"],"2⁸ = 256."),
Q("El código ASCII recoge…","La codificación de cada carácter de texto en su equivalente numérico decimal",["Los colores","Los sonidos","Las licencias"],"Tabla de caracteres."),
Q("Los caracteres imprimibles del código ASCII van desde el…","33 hasta el 126",["0 hasta el 32","1 hasta el 100","128 hasta el 255"],"Incluye letras, números y signos."),
Q("Letras como la ñ o las vocales con tilde están en…","El grupo llamado ASCII extendido",["Los imprimibles","El código RGB","El sistema hexadecimal"],"No están en los imprimibles."),
Q("¿Qué número decimal corresponde a la letra D mayúscula?","68",["65","100","44"],"En binario 1000100."),
Q("La letra D en binario es…","1000100",["1100100","1010100","1000010"],"68 en binario."),
Q("Para pasar un número decimal a binario se divide por 2…","Hasta que el cociente sea menor que 2; los restos, de derecha a izquierda, forman el binario",["Hasta que sea 10","Una sola vez","Hasta que sea 0 y se leen de izquierda a derecha"],"El último cociente es el bit más significativo."),
Q("33 en binario es…","100001",["110001","100010","101001"],"33 = 32 + 1."),
Q("Para pasar de binario a decimal se multiplica cada dígito por…","Una potencia de 2, empezando por la derecha con exponente 0, y se suman",["Una potencia de 10","Un número primo","El valor ASCII"],"Después se suman."),
Q("100001 en decimal es…","33",["32","65","17"],"1·2⁵ + 0 + 0 + 0 + 0 + 1·2⁰ = 32 + 1."),
Q("1·2⁵ vale…","32",["16","10","64"],"2⁵ = 32."),
Q("2⁸ vale…","256",["128","64","512"],"256 caracteres."),
Q("Las imágenes digitales están formadas por…","Pequeños puntos llamados píxeles",["Letras","Bits sueltos únicamente","Licencias"],"Cada píxel tiene un color."),
Q("El código RGB representa…","La intensidad de los colores rojo, verde y azul de cada píxel",["Letras mayúsculas","Los caracteres imprimibles","Los números hexadecimales"],"Red, Green, Blue."),
Q("En el código RGB, cada color tiene un valor entre…","0 (ausencia de color) y 255 (intensidad máxima)",["0 y 100","1 y 10","0 y 1000"],"256 intensidades."),
Q("El píxel (255, 255, 255) es de color…","Blanco",["Negro","Rojo","Amarillo"],"Intensidad máxima de los tres."),
Q("El píxel (255, 0, 0) es…","Rojo",["Verde","Azul","Amarillo"],"R al máximo."),
Q("El píxel (255, 255, 0) es…","Amarillo",["Rojo","Azul","Blanco"],"R y G al máximo."),
Q("El píxel (0, 255, 0) es…","Verde",["Rojo","Azul","Amarillo"],"G al máximo."),
Q("El valor 255 en binario es…","11111111",["10000000","11110000","01111111"],"Un byte con todos los bits a 1."),
Q("El valor 0 en binario (un byte) es…","00000000",["11111111","00000001","10000000"],"Un byte con todos los bits a 0."),
Q("El sistema hexadecimal es…","Un sistema basado en 16 dígitos: del 0 al 9 y las letras A, B, C, D, E y F",["Un sistema de 8 dígitos","Un sistema de 2 dígitos","Un sistema de 10 dígitos"],"Compacta el binario."),
Q("En hexadecimal, los números binarios se agrupan de…","Cuatro en cuatro",["Dos en dos","Ocho en ocho","Uno en uno"],"Cada grupo = un dígito hexadecimal."),
Q("El binario 1010 en hexadecimal es…","A",["B","C","F"],"1010 = 10 = A."),
Q("El binario 1111 en hexadecimal es…","F",["A","E","9"],"1111 = 15 = F."),
Q("El binario 110111110010 en hexadecimal es…","DF2",["D2F","FD2","DF1"],"1101 = D; 1111 = F; 0010 = 2."),
]},
{name:"6 · Operadores relacionales y lógicos",qs:[
Q("Una expresión booleana es la que…","Solo puede tener dos valores: verdadero o falso",["Puede valer cualquier número","Es un texto","No tiene valor"],"Se expresa con 1 y 0."),
Q("En código binario, «verdadero» es…","1",["0","2","-1"],"Falso es 0."),
Q("En código binario, «falso» es…","0",["1","2","-1"],"Verdadero es 1."),

Q("El operador «>» es…","Mayor que",["Menor que","Igual que","Distinto"],"Operador relacional."),
Q("El operador «<» es…","Menor que",["Mayor que","Igual que","Distinto"],"Operador relacional."),
Q("El operador «=» es…","Igual que",["Menor que","Mayor que","Y lógico"],"Operador relacional."),
Q("Los operadores lógicos principales son…","AND, OR y NOT",["Mayor, menor e igual","IF, FOR y WHILE","Suma, resta y producto"],"Combinan expresiones booleanas."),
Q("Los operadores lógicos permiten…","Combinar dos o más expresiones booleanas para tomar decisiones más precisas",["Sumar números","Dibujar bloques","Compilar"],"Tomar decisiones."),
Q("El operador AND también se llama…","Operador lógico Y o producto lógico",["Suma lógica","Negación","Operador relacional"],"Los dos deben ser verdaderos."),
Q("El operador AND devuelve un resultado positivo…","Solo cuando son positivos los dos estados de las entradas",["Cuando alguno es positivo","Cuando ninguno es positivo","Siempre"],"Producto."),
Q("Con C = 1 y S = 1, C AND S vale…","1",["0","2","No se sabe"],"Los dos están a 1."),
Q("Con C = 1 y S = 0, C AND S vale…","0",["1","2","No se sabe"],"Basta un 0 para que el AND sea 0."),
Q("Con C = 0 y S = 0, C AND S vale…","0",["1","2","No se sabe"],"Los dos a 0."),
Q("El operador OR también se llama…","Operador lógico O o suma lógica",["Producto lógico","Negación","Operador relacional"],"Alguno es positivo."),
Q("El operador OR devuelve un resultado positivo…","Cuando es positivo alguno de los estados de las entradas",["Solo cuando los dos son positivos","Solo cuando los dos son 0","Nunca"],"Suma."),
Q("Con C = 0 y S = 1, C OR S vale…","1",["0","2","No se sabe"],"Alguna entrada es 1."),
Q("Con C = 1 y S = 1, C OR S vale…","1",["0","2","No se sabe"],"Alguna (las dos) es 1."),
Q("Con C = 0 y S = 0, C OR S vale…","0",["1","2","No se sabe"],"Ninguna es 1."),

Q("El operador NOT devuelve…","Siempre el estado contrario al de la entrada",["El mismo estado","Siempre 1","Siempre 0"],"0 → 1; 1 → 0."),

Q("NOT 0 vale…","1",["0","2","No se sabe"],"Si la luz está apagada (L=0), el robot limpiará."),

Q("En el ejemplo del robot de limpieza, C y S representan…","La luz de la cocina y la luz del salón",["Dos números","Dos colores","Dos licencias"],"1 = encendida; 0 = apagada."),
Q("El robot limpiará cuando haya un 1 en C y un 1 en S: operador…","AND",["OR","NOT","Mayor que"],"Las dos luces encendidas."),

]},
{name:"7 · Apps para dispositivos móviles y eventos",qs:[
Q("Una aplicación móvil o app es…","Una herramienta de software diseñada para cubrir una necesidad, programada para funcionar en dispositivos móviles",["Un tipo de hardware","Un compilador","Una licencia"],"Para móviles."),
Q("Para desarrollar apps necesitamos…","Un lenguaje de programación y un entorno de desarrollo (IDE)",["Solo papel","Solo un móvil","Una licencia únicamente"],"Lo habitual es hacerlo en ordenadores."),
Q("IDE significa…","Entorno de desarrollo integrado",["Interfaz de datos externos","Instrucciones de entrada","Identificador de eventos"],"Integrated Development Environment."),
Q("App Inventor es…","Un lenguaje de programación orientada a eventos que permite crear aplicaciones para smartphones con Android",["Un compilador de C++","Un lenguaje textual","Un sistema operativo"],"IDE de bloques."),
Q("App Inventor fue creado por…","El Instituto Tecnológico de Massachusetts (MIT) y Google",["Microsoft","Apple","Python Foundation"],"Para Android."),
Q("App Inventor es un entorno de desarrollo…","De bloques (visual)",["Textual","Binario","Hexadecimal"],"Se arrastran bloques."),
Q("En la programación orientada a eventos…","Cuando el usuario provoca un evento sobre un elemento, se ejecutan las acciones programadas para ese evento",["El programa sigue siempre un orden fijo","El usuario no interviene","No hay interfaz"],"El usuario decide cuándo."),
Q("Un evento es…","La intervención del usuario sobre un elemento (por ejemplo, pulsar un botón)",["Un tipo de dato","Un bucle","Una licencia"],"Se realiza en cualquier momento."),
Q("La programación tradicional es…","Secuencial (o estructurada): sigue un orden establecido y el usuario solo interactúa en el momento planificado",["Orientada a eventos","Visual","Aleatoria"],"Planificada por el programador."),
Q("La ventaja de la programación orientada a eventos es que…","El programador no tiene que programar todos los escenarios posibles",["Es la más rápida","No tiene errores","Siempre es secuencial"],"El usuario decide."),
Q("El inconveniente de la programación orientada a eventos es que…","El flujo de ejecución del programa escapa a su control",["Es muy lenta","No funciona en móviles","Solo sirve para juegos"],"Hay que tener en cuenta las dependencias."),
Q("Hay dependencia de eventos cuando…","Un evento depende de otro (por ejemplo, un botón necesita que se haya pulsado otro primero)",["Dos eventos son independientes","No hay eventos","El programa es secuencial"],"Hay que controlarlo."),
Q("Son eventos con el ratón…","Hacer clic en un botón, doble clic, elegir una opción de menú, pasar el ratón por un sitio, arrastrar un elemento",["Presionar una tecla","Tocar la pantalla","Deslizar el dedo"],"Con el ratón."),
Q("Son eventos con el teclado…","Presionar una tecla, pulsar una combinación de teclas, escribir en una caja",["Hacer clic","Tocar la pantalla","Arrastrar"],"Con el teclado."),
Q("Son eventos manuales (táctiles)…","Tocar la pantalla o un botón, acercar y alejar pulgar e índice, deslizar, arrastrar",["Presionar una tecla","Hacer doble clic","Escribir en una caja"],"Con los dedos."),
Q("Hacer doble clic en un botón es un evento…","Con el ratón",["Con el teclado","Manual","De sistema"],"Evento de ratón."),
Q("Pulsar una combinación de teclas es un evento…","Con el teclado",["Con el ratón","Manual","De red"],"Evento de teclado."),
Q("Acercar el pulgar y el índice sobre la pantalla es un evento…","Manual",["Con el ratón","Con el teclado","De sistema"],"Evento táctil."),
]},

["Código RGB","Las imágenes digitales están formadas por píxeles. Cada píxel combina rojo, verde y azul con intensidades de 0 a 255 (1 byte cada uno). (255,0,0) rojo · (255,255,0) amarillo · (0,255,0) verde · (255,255,255) blanco.","5. Binario y códigos"],

["Expresión booleana","Expresión con solo dos valores: verdadero (1) o falso (0).","6. Operadores"],
["Operadores relacionales","Relacionan valores numéricos: mayor que (>), menor que (<) e igual que (=).","6. Operadores"],

const $=s=>document.querySelector(s);

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type,v,delay,slide){const c=ac();if(!c||store.mute)return;const t=c.currentTime+(delay||0);const o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.12,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03)}
function noise(d,v,fq){const c=ac();if(!c||store.mute)return;const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type="bandpass";f.frequency.value=fq;g.gain.value=v;s.connect(f);f.connect(g);g.connect(c.destination);s.start()}
const SFX={

  ok(s){const b=523*Math.pow(2,Math.min(s,8)/12);[1,1.26,1.5].forEach((m,i)=>tone(b*m,.16,"triangle",.13,i*.065))},
  ko(){tone(230,.3,"sawtooth",.1,0,110);tone(170,.34,"square",.06,.08,70)},
  tick(){tone(950,.04,"square",.035)},
  flip(){noise(.14,.07,2600)},
  star(i){tone(784*Math.pow(2,i/6),.2,"triangle",.13)},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.24,"triangle",.13,i*.1))},
  lose(){[392,349,294].forEach((f,i)=>tone(f,.32,"sine",.11,i*.18))},
  level(){[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,"square",.06,i*.08));tone(1568,.6,"triangle",.12,.52)},

const cv=document.createElement("canvas");cv.id="fx";document.body.appendChild(cv);
const cx=cv.getContext("2d");let P=[],raf=0;
const COL=["#00d4a0","#6ffdd6","#f5c542","#9d7bff","#ff4d6a","#ffffff"];
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener("resize",fit);
function burst(x,y,n){if(reduce)return;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*6;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,g:.18,l:55+Math.random()*30,s:4+Math.random()*5,c:COL[i%COL.length],r:Math.random()*6,vr:(Math.random()-.5)*.4})}run()}
function confetti(n){if(reduce)return;for(let i=0;i<n;i++)P.push({x:Math.random()*innerWidth,y:-10-Math.random()*240,vx:(Math.random()-.5)*3,vy:2+Math.random()*3.5,g:.05,l:150+Math.random()*90,s:5+Math.random()*6,c:COL[i%COL.length],r:Math.random()*6,vr:(Math.random()-.5)*.3});run()}
function run(){if(!raf)raf=requestAnimationFrame(frame)}
function frame(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0&&p.y<innerHeight+20);for(const p of P){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.995;p.r+=p.vr;p.l--;cx.save();cx.globalAlpha=Math.min(1,p.l/30);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore()}raf=P.length?requestAnimationFrame(frame):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}

function startTest(m,exam,reto){
  const all=ALLQ();let qs,name,key;
  if(m==="mix"){qs=shuffle(all).slice(0,20);name="Mixto";key="mix"}
  else if(m==="fails"){qs=all.filter(q=>store.fails.includes(q.q));name="Repaso de fallos";key="fails";if(!qs.length){app.innerHTML=`<div class="card res"><div class="stars">🎉</div><b>No tienes fallos guardados.</b><p class="mut">Juega un test y vuelve aquí.</p><div class="actions"><button class="big-btn play" id="b">Ver tests</button></div></div>`;$("#b").onclick=()=>go("tests");return}}
  else if(m[0]==="t"){const t=TOPICS[+m.slice(1)];qs=t.qs.slice();name=t.name;key="mt"+m.slice(1)}
  else{qs=MODELS[+m].qs.slice();name=MODELS[+m].name;key="m"+m}
  qs=shuffle(qs).map(q=>({...q,opts:shuffle([q.ok,...q.bad])}));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==="tests"));
  T={key,name,exam,reto,qs,i:0,ans:[],locked:false,streak:0,best:0,xp:0};
  renderQ();
}
function hud(){return `<div class="hud"><div class="pill"><div class="l">Pregunta</div><div class="v">${T.i+1}/${T.qs.length}</div></div>
 <div class="pill"><div class="l">Racha</div><div class="v y" id="h-s">${T.exam?"—":"🔥 "+T.streak}</div></div>
 <div class="pill"><div class="l">XP</div><div class="v g" id="h-x">${T.exam?"—":"+"+T.xp}</div></div><span class="sp"></span><button class="exit" id="quit">Salir</button></div>`}
function renderQ(){
  stopTimer();
  const q=T.qs[T.i],n=T.qs.length;T.locked=false;
  app.innerHTML=`${hud()}<div class="timebar"><i id="tf" style="width:${T.reto?100:(T.i/n*100)}%"></i></div>
  <div class="card"><div class="sec">${esc(T.name)}${T.exam?" · examen":""}${T.reto?" · reto":""}</div><div class="q">${esc(q.q)}</div>
  <div id="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
  <div id="fb"></div><div class="row" style="margin-top:12px"><span class="sp"></span><button class="big-btn play" id="next" hidden style="padding:12px 22px;font-size:.95rem"></button></div></div>`;
  $("#quit").onclick=()=>{stopTimer();go("tests")};
  $("#opts").onclick=e=>{const b=e.target.closest(".opt");if(b)pick(+b.dataset.k,b)};
  $("#next").onclick=nextQ;
  if(T.reto){T.t0=Date.now();timer=setInterval(()=>{const f=Math.max(0,1-(Date.now()-T.t0)/20000);const el=$("#tf");if(!el){stopTimer();return}el.style.width=f*100+"%";el.classList.toggle("low",f<.3);const sc=Math.ceil(f*20);if(sc<=5&&sc!==T.ls){T.ls=sc;SFX.tick()}if(f<=0){stopTimer();timeout()}},100)}
}
function nextQ(){if(T.i+1<T.qs.length){T.i++;renderQ()}else finish()}
function showNext(){const nx=$("#next");nx.hidden=false;nx.textContent=T.i+1<T.qs.length?"Siguiente →":"Ver resultado"}
function reveal(q,k){
  T.locked=true;stopTimer();
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;b.classList.remove("sel");if(q.opts[j]===q.ok)b.classList.add("ok");else if(j===k)b.classList.add("ko")});
}
function timeout(){
  const q=T.qs[T.i];
  if(T.exam){nextQ();return}
  T.ans[T.i]=undefined;T.streak=0;reveal(q,-1);SFX.ko();shakeCard();
  $("#fb").innerHTML=`<div class="fb ko"><b class="t">Tiempo agotado</b><br>Respuesta correcta: <b>${esc(q.ok)}</b><br><br><b>¿Por qué?</b> ${esc(q.why)}</div>`;
  $("#h-s").textContent="🔥 0";showNext();
}
function pick(k,btn){
  const q=T.qs[T.i];
  if(T.exam){T.ans[T.i]=k;document.querySelectorAll(".opt").forEach((b,j)=>b.classList.toggle("sel",j===k));showNext();return}
  if(T.locked)return;
  T.ans[T.i]=k;reveal(q,k);
  const good=q.opts[k]===q.ok;
  if(good){
    T.streak++;T.best=Math.max(T.best,T.streak);
    const g=10+Math.min(T.streak-1,5)*2;T.xp+=g;addXP(g);
    SFX.ok(T.streak);const r=btn.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,16);if([3,5,7,10,15,20].includes(T.streak)){showBanner("COMBO x"+T.streak,"🔥 EN RACHA");SFX.combo();burst(innerWidth/2,innerHeight/3,60)}
    const p=document.createElement("div");p.className="pop";p.textContent="+"+g+(T.streak>1?" 🔥":"");p.style.left=r.left+r.width/2-20+"px";p.style.top=r.top+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),900);
    $("#fb").innerHTML=`<div class="fb ok"><b class="t">¡Correcto!</b><br>${esc(q.why)}</div>`;
  }else{
    T.streak=0;SFX.ko();if(navigator.vibrate)navigator.vibrate(120);shakeCard();
    $("#fb").innerHTML=`<div class="fb ko"><b class="t">Fallo</b> · la correcta es:<br><b>${esc(q.ok)}</b><br><br><b>¿Por qué?</b> ${esc(q.why)}</div>`;
  }
  $("#h-s").textContent="🔥 "+T.streak;bumpEl($("#h-s"));bumpEl($("#h-x"));$("#h-x").textContent="+"+T.xp;showNext();
}
document.addEventListener("keydown",e=>{
  if(!T||!$("#opts")||e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT")return;
  if("1234".includes(e.key)){const b=document.querySelectorAll(".opt")[+e.key-1];if(b&&!b.disabled)b.click()}
  else if(e.key==="Enter"){const nx=$("#next");if(nx&&!nx.hidden)nx.click()}
});
function finish(){
  stopTimer();
  const n=T.qs.length;
  const wrong=T.qs.filter((q,i)=>q.opts[T.ans[i]]!==q.ok);
  const sc=n-wrong.length;
  let gain=T.xp;
  if(T.exam){gain=sc*10;addXP(gain)}
  if(sc===n&&n>=10){gain+=50;addXP(50)}
  store.fails=store.fails.filter(f=>!T.qs.some(q=>q.q===f));wrong.forEach(q=>store.fails.push(q.q));
  const r=store.tests[T.key]||{best:0,tries:0};r.tries++;r.best=Math.max(r.best,sc);r.last=sc;r.n=n;store.tests[T.key]=r;
  store.answered+=n;store.correct+=sc;store.bestStreak=Math.max(store.bestStreak,T.best);
  store.hist=store.hist.concat({name:T.name,sc,n,d:new Date().toLocaleDateString("es-ES")}).slice(-30);
  save();paintWallet();
  const pct=sc/n,nota=(pct*10).toFixed(1),stars=pct>=.9?3:pct>=.7?2:pct>=.5?1:0;
  const C=2*Math.PI*60,col=pct>=.7?"var(--accent)":pct>=.5?"var(--yellow)":"var(--red)";
  app.innerHTML=`<div class="card res"><div class="sec">${esc(T.name)}</div>
   <svg class="ring" viewBox="0 0 150 150"><circle cx="75" cy="75" r="60" fill="none" stroke="var(--surface2)" stroke-width="12"/><circle id="arc" cx="75" cy="75" r="60" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 ${C}" style="transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.3,1)" transform="rotate(-90 75 75)"/><text x="75" y="72" text-anchor="middle" font-size="30" fill="var(--text)" id="nota">0.0</text><text x="75" y="96" text-anchor="middle" font-size="12" fill="var(--text2)">${sc}/${n}</text></svg>
   <div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?"star":""}" style="${i<stars?"animation-delay:"+(.5+i*.35)+"s":"color:var(--text3)"}">★</span>`).join("")}</div>
   <div class="stats"><div class="pill"><div class="l">XP ganada</div><div class="v g">+${gain}</div></div><div class="pill"><div class="l">Mejor racha</div><div class="v y">${T.exam?"—":T.best}</div></div><div class="pill"><div class="l">Nivel</div><div class="v p">${level()}</div></div></div>
   <p class="mut" style="margin-top:12px">${sc===n?"¡Perfecto! Bonus de +50 XP.":pct>=.5?"Aprobado. Repasa los fallos de abajo.":"A repasar un poco más. Tú puedes."}</p>
   <div class="actions"><button class="big-btn play" id="again">Jugar otra vez</button><button class="big-btn alt" id="back">Menú</button></div></div>
   ${wrong.length?`<h2>Tus fallos (${wrong.length})</h2>`+wrong.map(q=>`<div class="card rev" style="margin-bottom:10px"><div class="tit">${esc(q.q)}</div>
     <div class="fb ko">Tu respuesta: ${esc(q.opts[T.ans[T.qs.indexOf(q)]]??"(sin responder)")}</div>
     <div class="fb ok" style="margin-top:8px"><b class="t">Correcta</b><br><b>${esc(q.ok)}</b><br><span class="mut">${esc(q.why)}</span></div></div>`).join(""):""}`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const arc=$("#arc");if(arc)arc.setAttribute("stroke-dasharray",(C*pct)+" "+C)}));
  countUp($("#nota"),0,+nota,1100,1);
  [0,1,2].forEach(i=>{if(i<stars)setTimeout(()=>SFX.star(i),520+i*350)});
  if(pct>=.7){setTimeout(()=>{SFX.win();confetti(pct===1?280:150);if(pct===1)showBanner("¡PERFECTO!","+50 XP")},350)}else if(pct<.5)SFX.lose();
  const m=T.key;$("#again").onclick=()=>startTest(m.startsWith("mt")?"t"+m.slice(2):m.startsWith("m")&&m!=="mix"?m.slice(1):m,T.exam,T.reto);
  $("#back").onclick=()=>go("tests");
}

/* ============ TARJETAS ============ */
let C={sec:"Todas",i:0,onlyReview:false};
function viewCards(){
  const secs=["Todas",...new Set(CARDS.map(c=>c[2]))];
  const pool=CARDS.map((c,id)=>({c,id})).filter(x=>(C.sec==="Todas"||x.c[2]===C.sec)&&(!C.onlyReview||!store.known[x.id]));
  if(C.i>=pool.length)C.i=0;
  const cur=pool[C.i];
  const kn=Object.values(store.known).filter(Boolean).length;
  app.innerHTML=`<div class="chips">${secs.map(s=>`<button class="chip ${s===C.sec?"on":""}" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
  <div class="row"><label class="mut" style="cursor:pointer"><input type="checkbox" id="rev" ${C.onlyReview?"checked":""} style="accent-color:var(--accent)"> Solo las que aún no sé</label><span class="sp"></span><div class="pill"><div class="l">Dominadas</div><div class="v g">${kn}/${CARDS.length}</div></div></div>
  ${cur?`<div class="flash"><div class="flip" id="flip"><div class="face front"><div class="sec">${esc(cur.c[2])}</div>${esc(cur.c[0])}<div class="hint">toca para girar</div></div><div class="face back">${esc(cur.c[1])}</div></div></div>
  <div class="row"><button class="mini" id="prev">←</button><span class="mut" style="font-family:var(--mono)">${C.i+1}/${pool.length}</span><button class="mini" id="nx">→</button><span class="sp"></span><button class="mini" id="rv">🔁 Repasar</button><button class="big-btn play" id="kn" style="padding:10px 18px;font-size:.9rem">✓ Me la sé</button></div>
  <div class="row" style="margin-top:10px"><button class="mini" id="sh">🔀 Aleatoria</button></div>`:`<div class="card res"><div class="stars">🎉</div>No quedan tarjetas pendientes en esta selección.</div>`}`;
  app.onclick=e=>{const ch=e.target.closest(".chip");if(ch){C.sec=ch.dataset.s;C.i=0;viewCards()}};
  $("#rev").onchange=e=>{C.onlyReview=e.target.checked;C.i=0;viewCards()};
  if(!cur)return;
  $("#flip").onclick=()=>{SFX.flip();$("#flip").classList.toggle("on")};
  const mv=d=>{C.i=(C.i+d+pool.length)%pool.length;viewCards()};
  $("#prev").onclick=()=>mv(-1);$("#nx").onclick=()=>mv(1);
  $("#kn").onclick=()=>{if(!store.known[cur.id])addXP(3);store.known[cur.id]=true;save();SFX.known();const r=$(".flash").getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,24);$(".flash").classList.add("fly");setTimeout(()=>{if(!$(".flash"))return;if(!C.onlyReview)C.i=(C.i+1)%pool.length;viewCards()},reduce?0:380)};
  $("#rv").onclick=()=>{store.known[cur.id]=false;save();mv(1)};
  $("#sh").onclick=()=>{C.i=Math.floor(Math.random()*pool.length);viewCards()};
}

/* ============ DESARROLLO ============ */
let D={i:0};
function viewDev(){
  const d=DEV[D.i];
  app.innerHTML=`<div class="card"><div class="row"><div class="sec" style="margin:0">Pregunta de desarrollo</div><span class="sp"></span><span class="mut" style="font-family:var(--mono)">${D.i+1}/${DEV.length}</span></div>
  <div class="q" style="margin-top:10px">${esc(d.q)}</div>
  <textarea id="txt" placeholder="Escribe aquí tu respuesta…">${esc(store["dev"+D.i]||"")}</textarea>
  <div class="row" style="margin-top:12px"><button class="mini" id="p">←</button><button class="mini" id="n">→</button><span class="sp"></span><button class="big-btn play" id="chk" style="padding:11px 22px;font-size:.95rem">Comprobar</button></div>
  <div id="res"></div></div>`;
  $("#txt").oninput=e=>{store["dev"+D.i]=e.target.value;save()};
  $("#p").onclick=()=>{D.i=(D.i+DEV.length-1)%DEV.length;viewDev()};
  $("#n").onclick=()=>{D.i=(D.i+1)%DEV.length;viewDev()};
  $("#chk").onclick=()=>{
    const t=norm($("#txt").value);
    const hits=d.kw.map(g=>g.some(w=>t.includes(norm(w))));
    const ok=hits.filter(Boolean).length;
    const k="devdone"+D.i;const pass=ok>=Math.ceil(d.kw.length*.6);if(pass&&!store[k]){store[k]=1;addXP(15)}if(pass){SFX.win();confetti(70)}
    $("#res").innerHTML=`<p style="margin-top:14px"><b style="font-family:var(--mono)">Conceptos clave: ${ok}/${d.kw.length}</b></p><div>${d.kw.map((g,i)=>`<span class="kw ${hits[i]?"has":"no"}">${hits[i]?"✓":"✗"} ${esc(g[0])}</span>`).join("")}</div>
    <p class="mut" style="margin-top:8px">Detección automática por palabras: si lo explicaste con otras, compara con el modelo.${ok>=Math.ceil(d.kw.length*.6)?" (+15 XP la primera vez)":""}</p>
    <div class="model-ans"><b>Respuesta modelo</b>\n${esc(d.ans)}</div>`;
  };
}

/* ============ PROGRESO ============ */
function viewStats(){
  const k=Object.values(store.known).filter(Boolean).length;
  const acc=store.answered?Math.round(store.correct/store.answered*100)+"%":"—";
  const row=(name,key,n)=>{const r=store.tests[key];const p=r?r.best/(r.n||n)*100:0;return `<div style="margin-bottom:12px"><div class="row mut" style="justify-content:space-between;margin-bottom:4px"><span style="color:var(--text)">${esc(name)}</span><span style="font-family:var(--mono)">${r?`★ ${r.best}/${r.n} · ${r.tries}x`:"sin jugar"}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`};
  app.innerHTML=`<div class="stats" style="margin-top:0"><div class="pill"><div class="l">Nivel</div><div class="v p">${level()}</div></div><div class="pill"><div class="l">XP</div><div class="v g">${store.xp}</div></div><div class="pill"><div class="l">Precisión</div><div class="v y">${acc}</div></div><div class="pill"><div class="l">Tarjetas</div><div class="v g">${k}/${CARDS.length}</div></div><div class="pill"><div class="l">Por repasar</div><div class="v r">${store.fails.length}</div></div></div>
  ${TOPICS.length?`<h2>Por apartados</h2><div class="card">${TOPICS.map((m,i)=>row(m.name,"mt"+i,m.qs.length)).join("")}</div>`:""}
  <h2>Modelos de examen</h2><div class="card">${MODELS.map((m,i)=>row(m.name,"m"+i,m.qs.length)).join("")}</div>
  <h2>Últimos intentos</h2><div class="card hist">${store.hist.slice().reverse().slice(0,10).map(h=>`<p><span>${h.d} · ${esc(h.name)}</span><span>${h.sc}/${h.n}</span></p>`).join("")||'<span class="mut">Todavía no hay intentos.</span>'}</div>
  <div class="row" style="margin-top:16px"><button class="mini" id="rst" style="color:var(--red)">Borrar progreso</button><span class="mut" id="rstmsg"></span></div>`;
  let armed=false;$("#rst").onclick=()=>{if(!armed){armed=true;$("#rst").textContent="¿Seguro? Pulsa otra vez";return}store={tests:{},known:{},xp:0,answered:0,correct:0,bestStreak:0,fails:[],hist:[],sum:{},sx:{}};save();paintWallet();viewStats()};
}

/* ============ RESUMEN INTERACTIVO ============ */
let SM={open:-1};
function viewSummary(){
  if(typeof SUMMARY==="undefined"||!SUMMARY.length){app.innerHTML='<div class="card res">Aún no hay resumen para esta guía.</div>';return}
  if(SM.open>=0)return openPoint(SM.open);
  const done=SUMMARY.filter(s=>store.sum[s.id]).length,n=SUMMARY.length;
  app.innerHTML=`<h2 style="margin-top:0">📖 Resumen interactivo</h2><p class="mut">Un punto = una misión: gira las tarjetas, aprende el truco, ordena los pasos y supera el mini-reto. Cada punto dominado da XP.</p>
  <div class="row mut" style="justify-content:space-between;margin:12px 0 6px"><span>Progreso</span><span style="font-family:var(--mono)">${done}/${n} dominados</span></div><div class="bar" style="margin-bottom:16px"><i style="width:${done/n*100}%"></i></div>
  <div class="grid">${SUMMARY.map((s,i)=>`<button class="card mission" data-i="${i}"><b>${s.emoji} ${esc(s.title)}</b><div class="mut" style="font-size:.84rem">${esc(s.tag)}</div><div class="meta"><span>${s.points.length} claves${s.order?" · ordena":""}</span><span class="best">${store.sum[s.id]?"✓ dominado":"★ por jugar"}</span></div></button>`).join("")}</div>`;
  app.onclick=e=>{const c=e.target.closest(".mission");if(c){SM.open=+c.dataset.i;viewSummary()}};
}
function openPoint(i){
  const s=SUMMARY[i],n=s.points.length;
  const revealed=new Set();
  const ord=s.order?shuffle(s.order.items.map((t,k)=>({t,k}))):null;
  app.innerHTML=`<button class="mini" id="sback">← Todos los puntos</button>
  <div class="card" style="margin-top:12px;text-align:center"><div class="emo">${s.emoji}</div><h2 style="margin:8px 0 4px">${esc(s.title)}</h2><p class="mut">${esc(s.tag)}</p></div>
  <h2>Lo esencial <span class="mut" id="revc" style="font-family:var(--mono);font-size:.8rem">0/${n}</span></h2>
  <div class="grid fl">${s.points.map((p,k)=>`<button class="fc" data-k="${k}"><span class="ff">${p[0]}</span><span class="fb2">${p[1]}</span></button>`).join("")}</div>
  <div class="card trick"><div class="sec" style="color:var(--yellow)">💡 Truco para recordar</div>${s.trick}</div>
  ${ord?`<h2>🧩 ${esc(s.order.q)}</h2><div class="card"><p class="mut" id="ordmsg">Toca los pasos en el orden correcto. Siguiente: paso 1.</p><div class="ord" id="ord">${ord.map(o=>`<button class="ordb" data-k="${o.k}">${esc(o.t)}</button>`).join("")}</div></div>`:""}
  <h2>⚡ Mini-reto: ¿verdadero o falso?</h2>
  ${s.quiz.map((q,k)=>`<div class="card vf" data-k="${k}"><div>${q[0]}</div><div class="row"><button class="mini" data-a="1">Verdadero</button><button class="mini" data-a="0">Falso</button></div><div class="vfb"></div></div>`).join("")}
  <div class="actions sumdone"><button class="big-btn play" id="sdone">${store.sum[s.id]?"✓ Ya dominado · siguiente":"✓ ¡Dominado! (+10 XP)"}</button></div>`;
  $("#sback").onclick=()=>{SM.open=-1;viewSummary()};
  document.querySelectorAll(".fc").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;SFX.flip();b.classList.toggle("on");
    if(b.classList.contains("on"))revealed.add(k);
    $("#revc").textContent=revealed.size+"/"+n;
    if(revealed.size===n&&!store.sx["r"+s.id]){store.sx["r"+s.id]=1;addXP(5);showBanner("¡TODAS GIRADAS!","+5 XP");SFX.combo()}
  });
  if(ord){
    let nxt=0;
    $("#ord").onclick=e=>{
      const b=e.target.closest(".ordb");if(!b||b.disabled)return;
      if(+b.dataset.k===nxt){
        nxt++;b.disabled=true;b.classList.add("good");b.innerHTML=`<span class="n">${nxt}</span>`+b.innerHTML;SFX.ok(nxt);
        const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,10);
        if(nxt===ord.length){$("#ordmsg").textContent="¡Orden perfecto! 🎉";SFX.win();confetti(90);if(!store.sx["o"+s.id]){store.sx["o"+s.id]=1;addXP(8)}}
        else $("#ordmsg").textContent="¡Bien! Siguiente: paso "+(nxt+1)+".";
      }else{b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");SFX.ko();$("#ordmsg").textContent="Ese no va ahora. Siguiente: paso "+(nxt+1)+"."}
    };
  }
  document.querySelectorAll(".vf").forEach(card=>{
    const q=s.quiz[+card.dataset.k];
    card.onclick=e=>{
      const b=e.target.closest("button[data-a]");if(!b||card.dataset.done)return;
      card.dataset.done=1;const ans=b.dataset.a==="1",ok=ans===q[1];
      card.querySelectorAll("button").forEach(x=>{x.disabled=true;if((x.dataset.a==="1")===q[1])x.classList.add("right");else if(x===b)x.classList.add("wrong")});
      card.querySelector(".vfb").innerHTML=(ok?"<b style='color:var(--accent)'>¡Correcto!</b> ":"<b style='color:var(--red)'>Ojo:</b> ")+esc(q[2]);
      if(ok){SFX.ok(2);const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top,12);const k="v"+s.id+card.dataset.k;if(!store.sx[k]){store.sx[k]=1;addXP(3)}}else SFX.ko();
    };
  });
  $("#sdone").onclick=()=>{
    if(!store.sum[s.id]){store.sum[s.id]=1;addXP(10);save();SFX.win();confetti(120);showBanner("¡PUNTO DOMINADO!","+10 XP")}
    setTimeout(()=>{SM.open=(i+1<SUMMARY.length)?i+1:-1;viewSummary();window.scrollTo(0,0)},store.sum[s.id]&&!reduce?900:0);
  };
  window.scrollTo(0,0);
}
go("home");
</script>
</body>
