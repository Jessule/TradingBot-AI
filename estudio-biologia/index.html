<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estudio Biología Cuerpo Humano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0d12;--surface:#111620;--surface2:#161c28;--border:#1e2a3a;
  --accent:#00d4a0;--accent-dim:rgba(0,212,160,.12);--accent-line:rgba(0,212,160,.3);
  --red:#ff4d6a;--red-dim:rgba(255,77,106,.12);--yellow:#f5c542;--yellow-dim:rgba(245,197,66,.1);--purple:#9d7bff;
  --text:#e8edf5;--text2:#7a8fa8;--text3:#3d5068;
  --font:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1200px 600px at 50% -10%,rgba(0,212,160,.06),transparent),var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;min-height:100vh}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.02rem;letter-spacing:-.4px;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orb{width:14px;height:14px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 30% 30%,#6ffdd6,var(--accent));box-shadow:0 0 14px var(--accent)}
.wallet{display:flex;align-items:center;gap:8px;background:var(--accent-dim);border:1px solid var(--accent-line);padding:5px 12px;border-radius:30px;flex-shrink:0}
.wallet .amt{font-family:var(--mono);font-weight:700;color:var(--accent)}
.wallet .lbl{font-size:.62rem;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--bg);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex-shrink:0;background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.82rem;cursor:pointer;transition:all .15s}
.nav button:hover{border-color:var(--accent);color:var(--accent)}
.nav button.on{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent)}
main{max-width:920px;margin:0 auto;padding:20px 16px 80px}
h2{font-size:1.2rem;font-weight:700;letter-spacing:-.3px;margin:22px 0 10px}
.mut{color:var(--text2);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
/* hero */
.hero{text-align:center;padding:30px 0 10px}
.hero h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:700;letter-spacing:-1px;line-height:1.1}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--text2);max-width:480px;margin:12px auto 0;font-size:.95rem}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:24px 0 10px}
.big-btn{border:none;cursor:pointer;font-weight:700;padding:15px 28px;border-radius:14px;font-size:1.02rem;transition:transform .12s,box-shadow .2s}
.big-btn.play{background:linear-gradient(135deg,var(--accent),#06b386);color:#04150f;box-shadow:0 8px 30px rgba(0,212,160,.35)}
.big-btn.alt{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.big-btn:active{transform:scale(.96)}
.big-btn:disabled{opacity:.4;cursor:default}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.pill{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px 14px;text-align:center;min-width:92px}
.pill .l{font-size:.58rem;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.pill .v{font-family:var(--mono);font-weight:700;font-size:1.1rem}
.pill .v.g{color:var(--accent)}.pill .v.y{color:var(--yellow)}.pill .v.r{color:var(--red)}.pill .v.p{color:var(--purple)}
.lvl{max-width:420px;margin:18px auto 0}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--yellow));border-radius:6px;transition:width .3s}
/* mission cards */
.mission{cursor:pointer;text-align:left;transition:border-color .15s,transform .12s,box-shadow .2s;display:flex;flex-direction:column;gap:6px}
.mission:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-line),0 8px 24px rgba(0,212,160,.08);transform:translateY(-2px)}
.mission b{font-size:.95rem;line-height:1.25}
.mission .meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;color:var(--text2)}
.mission .best{color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px;margin:6px 0 0}
.toggle{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:.88rem}
.toggle input{accent-color:var(--accent);margin-top:4px;width:16px;height:16px}
/* play */
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.exit{background:var(--red-dim);border:1px solid rgba(255,77,106,.35);color:var(--red);border-radius:10px;padding:8px 14px;font-weight:700;font-size:.8rem;cursor:pointer}
.timebar{height:5px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-bottom:16px}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--accent),var(--yellow))}
.timebar i.low{background:var(--red)}
.q{font-size:clamp(1.05rem,3.4vw,1.3rem);font-weight:600;letter-spacing:-.2px;line-height:1.35;margin-bottom:14px;text-wrap:balance}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.opt .k{font-family:var(--mono);font-weight:700;font-size:.78rem;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:7px;min-width:26px;height:26px;display:grid;place-items:center;flex-shrink:0}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(2px)}
.opt.sel{border-color:var(--purple);background:rgba(157,123,255,.1)}
.opt.ok{border-color:var(--accent);background:var(--accent-dim);box-shadow:0 0 18px rgba(0,212,160,.2)}
.opt.ok .k{color:#04150f;background:var(--accent);border-color:var(--accent)}
.opt.ko{border-color:var(--red);background:var(--red-dim);animation:shake .35s}
.opt.ko .k{color:#fff;background:var(--red);border-color:var(--red)}
.opt:disabled{cursor:default;color:var(--text)}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{margin-top:6px;padding:13px 14px;border-radius:12px;border:1px solid;font-size:.93rem}
.fb.ok{background:var(--accent-dim);border-color:var(--accent-line)}
.fb.ko{background:var(--red-dim);border-color:rgba(255,77,106,.35)}
.fb b.t{font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:1px}
.fb.ok b.t{color:var(--accent)}.fb.ko b.t{color:var(--red)}
.pop{position:fixed;pointer-events:none;font-family:var(--mono);font-weight:700;color:var(--accent);text-shadow:0 0 10px rgba(0,212,160,.6);animation:floatUp .9s ease-out forwards;z-index:50}
@keyframes floatUp{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-46px) scale(1.3)}}
/* result */
.res{text-align:center;padding:10px 0}
.ring{width:150px;height:150px;margin:6px auto}
.ring text{font-family:var(--mono);font-weight:700}
.stars{font-size:1.6rem;letter-spacing:6px;margin:6px 0}
.rev{text-align:left;margin-top:12px}
.rev .tit{font-weight:600;margin-bottom:8px}
/* cards */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:20px;padding:6px 12px;font-size:.8rem;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent)}
.flash{perspective:1200px;margin:14px 0}
.flip{position:relative;height:280px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.8,.3,1);cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--border);overflow:auto}
.front{background:linear-gradient(160deg,var(--surface2),var(--surface));font-size:clamp(1.2rem,4vw,1.6rem);font-weight:700;letter-spacing:-.4px;box-shadow:0 0 0 1px var(--accent-line) inset}
.back{background:linear-gradient(160deg,#0f2a26,var(--surface));transform:rotateY(180deg);font-size:1.02rem;line-height:1.55;border-color:var(--accent-line)}
.hint{font-family:var(--mono);font-size:.68rem;color:var(--text3);margin-top:12px;font-weight:500;letter-spacing:1px;text-transform:uppercase}
.sec{font-family:var(--mono);font-size:.66rem;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;font-weight:700}
/* dev */
textarea{width:100%;min-height:150px;padding:13px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font:inherit;resize:vertical}
textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-dim)}
.kw{display:inline-block;margin:3px 5px 3px 0;padding:4px 11px;border-radius:14px;font-size:.82rem;font-weight:600;border:1px solid var(--border)}
.kw.has{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent)}
.kw.no{background:var(--red-dim);border-color:rgba(255,77,106,.35);color:var(--red)}
.model-ans{background:var(--yellow-dim);border:1px solid rgba(245,197,66,.3);padding:13px 14px;border-radius:12px;margin-top:12px;white-space:pre-line;font-size:.93rem}
.mini{background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:10px;padding:9px 14px;font-weight:600;font-size:.85rem;cursor:pointer}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.hist p{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.8rem;color:var(--text2);padding:5px 0;border-bottom:1px solid var(--border)}

/* ===== FX ===== */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.14;animation:drift 22s ease-in-out infinite alternate}
.bgfx i:nth-child(1){background:var(--accent);left:-12vmax;top:-12vmax}
.bgfx i:nth-child(2){background:var(--purple);right:-16vmax;top:30vh;animation-duration:28s;animation-delay:-8s}
.bgfx i:nth-child(3){background:#1e6fff;left:20vw;bottom:-26vmax;animation-duration:34s;animation-delay:-14s;opacity:.1}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:55}
#app>*{animation:rise .38s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.opt{animation:rise .4s cubic-bezier(.2,.8,.3,1) both}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
.opt.ok{animation:pulseOk .7s}
@keyframes pulseOk{0%{box-shadow:0 0 0 0 rgba(0,212,160,.7)}100%{box-shadow:0 0 0 20px rgba(0,212,160,0)}}
.shake{animation:shake .38s!important}
.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.22)}}
.hero h1 span{background:linear-gradient(90deg,#00d4a0,#6ffdd6,#9d7bff,#00d4a0);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:220% 0}}
.big-btn.play{position:relative;overflow:hidden}
.big-btn.play::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.big-btn:hover{transform:translateY(-2px)}
.banner{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:60}
.banner div{font-family:var(--mono);font-weight:700;font-size:clamp(2rem,11vw,4.2rem);color:var(--accent);text-shadow:0 0 30px var(--accent);animation:banner 1.5s ease-out forwards;text-align:center;line-height:1.1}
.banner small{display:block;font-size:.3em;color:var(--yellow);text-shadow:none;letter-spacing:3px;margin-top:8px}
@keyframes banner{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.18)}65%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-34px) scale(1.06)}}
.star{display:inline-block;animation:starpop .55s cubic-bezier(.2,1.5,.4,1) both;color:var(--yellow);text-shadow:0 0 14px rgba(245,197,66,.6)}
@keyframes starpop{0%{transform:scale(0) rotate(-120deg);opacity:0}100%{transform:scale(1);opacity:1}}
.fly{animation:fly .4s ease-in forwards!important}
@keyframes fly{to{transform:translateX(110%) rotate(14deg);opacity:0}}
.timebar i.low{animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.45}}
.snd{background:var(--surface2);border:1px solid var(--border);border-radius:10px;width:38px;height:34px;cursor:pointer;font-size:1rem}
.snd:hover{border-color:var(--accent)}
.flame{display:inline-block;animation:flick .9s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.18) rotate(-6deg)}}
.orb{animation:orbpulse 2.4s ease-in-out infinite}
@keyframes orbpulse{50%{box-shadow:0 0 22px var(--accent),0 0 6px #6ffdd6}}

/* ===== RESUMEN ===== */
.emo{font-size:3.4rem;line-height:1;display:inline-block;animation:emobounce 1.8s ease-in-out infinite}
@keyframes emobounce{50%{transform:translateY(-8px) rotate(-6deg) scale(1.08)}}
.fl{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.fc{position:relative;min-height:96px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;font-size:.93rem;line-height:1.4;transition:border-color .15s,transform .12s}
.fc:hover{border-color:var(--accent);transform:translateY(-2px)}
.fc .ff{font-weight:700;display:flex;gap:8px;align-items:center}
.fc .ff::after{content:"toca";font-family:var(--mono);font-size:.6rem;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-left:auto}
.fc .fb2{display:none}
.fc.on{background:linear-gradient(160deg,#0f2a26,var(--surface));border-color:var(--accent-line);animation:flipin .4s}
.fc.on .ff{display:none}.fc.on .fb2{display:block}
@keyframes flipin{from{transform:rotateX(80deg);opacity:.2}to{transform:none;opacity:1}}
.trick{background:linear-gradient(135deg,rgba(245,197,66,.1),var(--surface));border-color:rgba(245,197,66,.3);margin-top:16px;font-size:1rem}
.ord{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.ordb{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-weight:600;font-size:.9rem;cursor:pointer;transition:all .15s}
.ordb:hover:not(:disabled){border-color:var(--purple)}
.ordb.good{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);animation:pulseOk .6s}
.ordb.bad{animation:shake .35s;border-color:var(--red)}
.ordb .n{font-family:var(--mono);background:var(--accent);color:#04150f;border-radius:6px;padding:0 6px;margin-right:6px;font-size:.78rem}
.vf{margin-bottom:10px}
.vf .row{margin-top:10px}
.vf .mini.right{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.vf .mini.wrong{background:var(--red-dim);border-color:var(--red);color:var(--red);animation:shake .35s}
.vfb{margin-top:8px;font-size:.9rem}
.sumdone{margin:20px 0 6px}

/* ===== V/F ===== */
.vfcard{position:relative;min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:26px 20px;touch-action:pan-y;transition:transform .25s,opacity .25s}
.vfcard .big{font-size:3.2rem;line-height:1;animation:emobounce 1.8s ease-in-out infinite}
.vfcard .st{font-size:clamp(1.15rem,4.2vw,1.55rem);font-weight:700;letter-spacing:-.3px;line-height:1.3;text-wrap:balance}
.vfcard.out-r{transform:translateX(120%) rotate(12deg);opacity:0}
.vfcard.out-l{transform:translateX(-120%) rotate(-12deg);opacity:0}
.vfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.vfbtn{border:none;border-radius:16px;padding:18px 10px;font-weight:700;font-size:1.1rem;cursor:pointer;transition:transform .12s,box-shadow .2s}
.vfbtn:active{transform:scale(.95)}
.vfbtn.t{background:linear-gradient(135deg,var(--accent),#06b386);color:#04150f;box-shadow:0 8px 24px rgba(0,212,160,.3)}
.vfbtn.f{background:linear-gradient(135deg,var(--red),#d6334f);color:#fff;box-shadow:0 8px 24px rgba(255,77,106,.28)}
.vfbtn:disabled{opacity:.4;box-shadow:none}
.hearts{font-size:1.25rem;letter-spacing:2px}
.vfexp{margin-top:12px;min-height:74px}
.vfexp .fb{animation:rise .3s both}
.kb{font-family:var(--mono);font-size:.68rem;color:var(--text3);text-align:center;margin-top:10px;letter-spacing:1px}

.vfcard{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y;overflow:hidden;min-height:240px;will-change:transform}
.vfcard:active{cursor:grabbing}
.vfcard.popin{animation:popin .22s cubic-bezier(.2,1.3,.4,1)}
@keyframes popin{from{transform:scale(.88);opacity:.2}to{transform:none;opacity:1}}
.vfcard .tag{position:absolute;top:14px;font-family:var(--mono);font-weight:700;font-size:.8rem;letter-spacing:1px;padding:5px 10px;border-radius:9px;opacity:0;pointer-events:none;border:2px solid}
.vfcard .tag.t{left:14px;color:var(--accent);border-color:var(--accent);transform:rotate(-8deg)}
.vfcard .tag.f{right:14px;color:var(--red);border-color:var(--red);transform:rotate(8deg)}
.vfexp{min-height:110px}
.vfexp .fb{font-size:.88rem}
.vfbtns{margin-top:12px}.vfbtn{padding:15px 10px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.big-btn{padding:14px 22px}.flip{height:300px}}
</style>
</head>
<body>
<div class="bgfx"><i></i><i></i><i></i></div>
<div class="topbar">
  <div class="brand"><div class="orb"></div><span id="brand"></span></div>
  <div class="row" style="gap:8px;flex-wrap:nowrap"><button class="snd" id="snd" aria-label="Activar o silenciar sonido">🔊</button><div class="wallet"><span class="lbl" id="lvl">Nv 1</span><span class="amt" id="xp">0 XP</span></div></div>
</div>
<nav class="nav" id="nav">
  <button data-v="home" class="on">Inicio</button><button data-v="sum">📖 Resumen</button><button data-v="vf">⚡ V/F</button><button data-v="tests">Tests</button><button data-v="cards">Tarjetas</button><button data-v="dev">Desarrollo</button><button data-v="stats">Progreso</button>
</nav>
<main id="app"></main>

<script>
const APP={title:"Estudio Biología Cuerpo Humano",short:"Biología · Cuerpo humano",h1:"El cuerpo humano <span>por dentro</span>",sub:"Biología y Geología · Unidad 1: la organización del cuerpo humano. Tests, tarjetas, resumen interactivo y desarrollo. Gana XP y sube de nivel.",key:"estudioBio2"};
/* ============ DATOS ============ */
// Q(pregunta, respuesta correcta, [3 incorrectas], explicación)
const Q=(q,ok,bad,why)=>({q,ok,bad,why});

function noise(d,v,fq){const c=ac();if(!c||store.mute)return;const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type="bandpass";f.frequency.value=fq;g.gain.value=v;s.connect(f);f.connect(g);g.connect(c.destination);s.start()}

const cx=cv.getContext("2d");let P=[],raf=0;

function burst(x,y,n){if(reduce)return;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*6;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,g:.18,l:55+Math.random()*30,s:4+Math.random()*5,c:COL[i%COL.length],r:Math.random()*6,vr:(Math.random()-.5)*.4})}run()}

function run(){if(!raf)raf=requestAnimationFrame(frame)}
function frame(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0&&p.y<innerHeight+20);for(const p of P){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.995;p.r+=p.vr;p.l--;cx.save();cx.globalAlpha=Math.min(1,p.l/30);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore()}raf=P.length?requestAnimationFrame(frame):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}

function startTest(m,exam,reto){
  const all=ALLQ();let qs,name,key;
  if(m==="mix"){qs=shuffle(all).slice(0,20);name="Mixto";key="mix"}
  else if(m==="fails"){qs=all.filter(q=>store.fails.includes(q.q));name="Repaso de fallos";key="fails";if(!qs.length){app.innerHTML=`<div class="card res"><div class="stars">🎉</div><b>No tienes fallos guardados.</b><p class="mut">Juega un test y vuelve aquí.</p><div class="actions"><button class="big-btn play" id="b">Ver tests</button></div></div>`;$("#b").onclick=()=>go("tests");return}}
  else if(m[0]==="t"){const t=TOPICS[+m.slice(1)];qs=t.qs.slice();name=t.name;key="mt"+m.slice(1)}
  else{qs=MODELS[+m].qs.slice();name=MODELS[+m].name;key="m"+m}
  qs=shuffle(qs).map(q=>({...q,opts:shuffle([q.ok,...q.bad])}));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==="tests"));
  T={key,name,exam,reto,qs,i:0,ans:[],locked:false,streak:0,best:0,xp:0};

}

   <div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?"star":""}" style="${i<stars?"animation-delay:"+(.5+i*.35)+"s":"color:var(--text3)"}">★</span>`).join("")}</div>
   <div class="stats"><div class="pill"><div class="l">XP ganada</div><div class="v g">+${gain}</div></div><div class="pill"><div class="l">Mejor racha</div><div class="v y">${T.exam?"—":T.best}</div></div><div class="pill"><div class="l">Nivel</div><div class="v p">${level()}</div></div></div>
   <p class="mut" style="margin-top:12px">${sc===n?"¡Perfecto! Bonus de +50 XP.":pct>=.5?"Aprobado. Repasa los fallos de abajo.":"A repasar un poco más. Tú puedes."}</p>

     <div class="fb ok" style="margin-top:8px"><b class="t">Correcta</b><br><b>${esc(q.ok)}</b><br><span class="mut">${esc(q.why)}</span></div></div>`).join(""):""}`;

  ${cur?`<div class="flash"><div class="flip" id="flip"><div class="face front"><div class="sec">${esc(cur.c[2])}</div>${esc(cur.c[0])}<div class="hint">toca para girar</div></div><div class="face back">${esc(cur.c[1])}</div></div></div>
  <div class="row"><button class="mini" id="prev">←</button><span class="mut" style="font-family:var(--mono)">${C.i+1}/${pool.length}</span><button class="mini" id="nx">→</button><span class="sp"></span><button class="mini" id="rv">🔁 Repasar</button><button class="big-btn play" id="kn" style="padding:10px 18px;font-size:.9rem">✓ Me la sé</button></div>
  <div class="row" style="margin-top:10px"><button class="mini" id="sh">🔀 Aleatoria</button></div>`:`<div class="card res"><div class="stars">🎉</div>No quedan tarjetas pendientes en esta selección.</div>`}`;
  app.onclick=e=>{const ch=e.target.closest(".chip");if(ch){C.sec=ch.dataset.s;C.i=0;viewCards()}};
  $("#rev").onchange=e=>{C.onlyReview=e.target.checked;C.i=0;viewCards()};
  if(!cur)return;
  $("#flip").onclick=()=>{SFX.flip();$("#flip").classList.toggle("on")};
  const mv=d=>{C.i=(C.i+d+pool.length)%pool.length;viewCards()};
  $("#prev").onclick=()=>mv(-1);$("#nx").onclick=()=>mv(1);
  $("#kn").onclick=()=>{if(!store.known[cur.id])addXP(3);store.known[cur.id]=true;save();SFX.known();const r=$(".flash").getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,24);$(".flash").classList.add("fly");setTimeout(()=>{if(!$(".flash"))return;if(!C.onlyReview)C.i=(C.i+1)%pool.length;viewCards()},reduce?0:380)};
  $("#rv").onclick=()=>{store.known[cur.id]=false;save();mv(1)};
  $("#sh").onclick=()=>{C.i=Math.floor(Math.random()*pool.length);viewCards()};
}

/* ============ DESARROLLO ============ */
let D={i:0};
function viewDev(){
  const d=DEV[D.i];
  app.innerHTML=`<div class="card"><div class="row"><div class="sec" style="margin:0">Pregunta de desarrollo</div><span class="sp"></span><span class="mut" style="font-family:var(--mono)">${D.i+1}/${DEV.length}</span></div>
  <div class="q" style="margin-top:10px">${esc(d.q)}</div>
  <textarea id="txt" placeholder="Escribe aquí tu respuesta…">${esc(store["dev"+D.i]||"")}</textarea>
  <div class="row" style="margin-top:12px"><button class="mini" id="p">←</button><button class="mini" id="n">→</button><span class="sp"></span><button class="big-btn play" id="chk" style="padding:11px 22px;font-size:.95rem">Comprobar</button></div>
  <div id="res"></div></div>`;
  $("#txt").oninput=e=>{store["dev"+D.i]=e.target.value;save()};
  $("#p").onclick=()=>{D.i=(D.i+DEV.length-1)%DEV.length;viewDev()};
  $("#n").onclick=()=>{D.i=(D.i+1)%DEV.length;viewDev()};
  $("#chk").onclick=()=>{
    const t=norm($("#txt").value);
    const hits=d.kw.map(g=>g.some(w=>t.includes(norm(w))));
    const ok=hits.filter(Boolean).length;
    const k="devdone"+D.i;const pass=ok>=Math.ceil(d.kw.length*.6);if(pass&&!store[k]){store[k]=1;addXP(15)}if(pass){SFX.win();confetti(70)}
    $("#res").innerHTML=`<p style="margin-top:14px"><b style="font-family:var(--mono)">Conceptos clave: ${ok}/${d.kw.length}</b></p><div>${d.kw.map((g,i)=>`<span class="kw ${hits[i]?"has":"no"}">${hits[i]?"✓":"✗"} ${esc(g[0])}</span>`).join("")}</div>
    <p class="mut" style="margin-top:8px">Detección automática por palabras: si lo explicaste con otras, compara con el modelo.${ok>=Math.ceil(d.kw.length*.6)?" (+15 XP la primera vez)":""}</p>
    <div class="model-ans"><b>Respuesta modelo</b>\n${esc(d.ans)}</div>`;
  };
}

/* ============ PROGRESO ============ */
function viewStats(){
  const k=Object.values(store.known).filter(Boolean).length;
  const acc=store.answered?Math.round(store.correct/store.answered*100)+"%":"—";
  const row=(name,key,n)=>{const r=store.tests[key];const p=r?r.best/(r.n||n)*100:0;return `<div style="margin-bottom:12px"><div class="row mut" style="justify-content:space-between;margin-bottom:4px"><span style="color:var(--text)">${esc(name)}</span><span style="font-family:var(--mono)">${r?`★ ${r.best}/${r.n} · ${r.tries}x`:"sin jugar"}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`};
  app.innerHTML=`<div class="stats" style="margin-top:0"><div class="pill"><div class="l">Nivel</div><div class="v p">${level()}</div></div><div class="pill"><div class="l">XP</div><div class="v g">${store.xp}</div></div><div class="pill"><div class="l">Precisión</div><div class="v y">${acc}</div></div><div class="pill"><div class="l">Tarjetas</div><div class="v g">${k}/${CARDS.length}</div></div><div class="pill"><div class="l">Por repasar</div><div class="v r">${store.fails.length}</div></div></div>
  ${TOPICS.length?`<h2>Por apartados</h2><div class="card">${TOPICS.map((m,i)=>row(m.name,"mt"+i,m.qs.length)).join("")}</div>`:""}
  <h2>Modelos de examen</h2><div class="card">${MODELS.map((m,i)=>row(m.name,"m"+i,m.qs.length)).join("")}</div>
  <h2>Últimos intentos</h2><div class="card hist">${store.hist.slice().reverse().slice(0,10).map(h=>`<p><span>${h.d} · ${esc(h.name)}</span><span>${h.sc}/${h.n}</span></p>`).join("")||'<span class="mut">Todavía no hay intentos.</span>'}</div>
  <div class="row" style="margin-top:16px"><button class="mini" id="rst" style="color:var(--red)">Borrar progreso</button><span class="mut" id="rstmsg"></span></div>`;
  let armed=false;$("#rst").onclick=()=>{if(!armed){armed=true;$("#rst").textContent="¿Seguro? Pulsa otra vez";return}store={tests:{},known:{},xp:0,answered:0,correct:0,bestStreak:0,fails:[],hist:[],sum:{},sx:{},vfbest:0,vffail:[]};save();paintWallet();viewStats()};
}

/* ============ RESUMEN INTERACTIVO ============ */
let SM={open:-1};
function viewSummary(){
  if(typeof SUMMARY==="undefined"||!SUMMARY.length){app.innerHTML='<div class="card res">Aún no hay resumen para esta guía.</div>';return}
  if(SM.open>=0)return openPoint(SM.open);
  const done=SUMMARY.filter(s=>store.sum[s.id]).length,n=SUMMARY.length;
  app.innerHTML=`<h2 style="margin-top:0">📖 Resumen interactivo</h2><p class="mut">Un punto = una misión: gira las tarjetas, aprende el truco, ordena los pasos y supera el mini-reto. Cada punto dominado da XP.</p>
  <div class="row mut" style="justify-content:space-between;margin:12px 0 6px"><span>Progreso</span><span style="font-family:var(--mono)">${done}/${n} dominados</span></div><div class="bar" style="margin-bottom:16px"><i style="width:${done/n*100}%"></i></div>
  <div class="grid">${SUMMARY.map((s,i)=>`<button class="card mission" data-i="${i}"><b>${s.emoji} ${esc(s.title)}</b><div class="mut" style="font-size:.84rem">${esc(s.tag)}</div><div class="meta"><span>${s.points.length} claves${s.order?" · ordena":""}</span><span class="best">${store.sum[s.id]?"✓ dominado":"★ por jugar"}</span></div></button>`).join("")}</div>`;
  app.onclick=e=>{const c=e.target.closest(".mission");if(c){SM.open=+c.dataset.i;viewSummary()}};
}
function openPoint(i){
  const s=SUMMARY[i],n=s.points.length;
  const revealed=new Set();
  const ord=s.order?shuffle(s.order.items.map((t,k)=>({t,k}))):null;
  app.innerHTML=`<button class="mini" id="sback">← Todos los puntos</button>
  <div class="card" style="margin-top:12px;text-align:center"><div class="emo">${s.emoji}</div><h2 style="margin:8px 0 4px">${esc(s.title)}</h2><p class="mut">${esc(s.tag)}</p></div>
  <h2>Lo esencial <span class="mut" id="revc" style="font-family:var(--mono);font-size:.8rem">0/${n}</span></h2>
  <div class="grid fl">${s.points.map((p,k)=>`<button class="fc" data-k="${k}"><span class="ff">${p[0]}</span><span class="fb2">${p[1]}</span></button>`).join("")}</div>
  <div class="card trick"><div class="sec" style="color:var(--yellow)">💡 Truco para recordar</div>${s.trick}</div>
  ${ord?`<h2>🧩 ${esc(s.order.q)}</h2><div class="card"><p class="mut" id="ordmsg">Toca los pasos en el orden correcto. Siguiente: paso 1.</p><div class="ord" id="ord">${ord.map(o=>`<button class="ordb" data-k="${o.k}">${esc(o.t)}</button>`).join("")}</div></div>`:""}
  <h2>⚡ Mini-reto: ¿verdadero o falso?</h2>
  ${s.quiz.map((q,k)=>`<div class="card vf" data-k="${k}"><div>${q[0]}</div><div class="row"><button class="mini" data-a="1">Verdadero</button><button class="mini" data-a="0">Falso</button></div><div class="vfb"></div></div>`).join("")}
  <div class="actions sumdone"><button class="big-btn play" id="sdone">${store.sum[s.id]?"✓ Ya dominado · siguiente":"✓ ¡Dominado! (+10 XP)"}</button></div>`;
  $("#sback").onclick=()=>{SM.open=-1;viewSummary()};
  document.querySelectorAll(".fc").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;SFX.flip();b.classList.toggle("on");
    if(b.classList.contains("on"))revealed.add(k);
    $("#revc").textContent=revealed.size+"/"+n;
    if(revealed.size===n&&!store.sx["r"+s.id]){store.sx["r"+s.id]=1;addXP(5);showBanner("¡TODAS GIRADAS!","+5 XP");SFX.combo()}
  });
  if(ord){
    let nxt=0;
    $("#ord").onclick=e=>{
      const b=e.target.closest(".ordb");if(!b||b.disabled)return;
      if(+b.dataset.k===nxt){
        nxt++;b.disabled=true;b.classList.add("good");b.innerHTML=`<span class="n">${nxt}</span>`+b.innerHTML;SFX.ok(nxt);
        const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,10);
        if(nxt===ord.length){$("#ordmsg").textContent="¡Orden perfecto! 🎉";SFX.win();confetti(90);if(!store.sx["o"+s.id]){store.sx["o"+s.id]=1;addXP(8)}}
        else $("#ordmsg").textContent="¡Bien! Siguiente: paso "+(nxt+1)+".";
      }else{b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");SFX.ko();$("#ordmsg").textContent="Ese no va ahora. Siguiente: paso "+(nxt+1)+"."}
    };
  }
  document.querySelectorAll(".vf").forEach(card=>{
    const q=s.quiz[+card.dataset.k];
    card.onclick=e=>{
      const b=e.target.closest("button[data-a]");if(!b||card.dataset.done)return;
      card.dataset.done=1;const ans=b.dataset.a==="1",ok=ans===q[1];
      card.querySelectorAll("button").forEach(x=>{x.disabled=true;if((x.dataset.a==="1")===q[1])x.classList.add("right");else if(x===b)x.classList.add("wrong")});
      card.querySelector(".vfb").innerHTML=(ok?"<b style='color:var(--accent)'>¡Correcto!</b> ":"<b style='color:var(--red)'>Ojo:</b> ")+esc(q[2]);
      if(ok){SFX.ok(2);const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top,12);const k="v"+s.id+card.dataset.k;if(!store.sx[k]){store.sx[k]=1;addXP(3)}}else SFX.ko();
    };
  });
  $("#sdone").onclick=()=>{
    if(!store.sum[s.id]){store.sum[s.id]=1;addXP(10);save();SFX.win();confetti(120);showBanner("¡PUNTO DOMINADO!","+10 XP")}
    setTimeout(()=>{SM.open=(i+1<SUMMARY.length)?i+1:-1;viewSummary();window.scrollTo(0,0)},store.sum[s.id]&&!reduce?900:0);
  };
  window.scrollTo(0,0);
}

/* ============ JUEGO V/F (desliza: derecha = verdadero, izquierda = falso) ============ */
const EMO=["🤔","😎","🧠","⚡","🎯","🔥","🌟","🤓","🎲","🚀","💡","🧩","🦾","🧪","🎮"];
function autoVF(){
  const out=[];
  ALLQ().forEach((q,ix)=>{
    const stem=q.q.trim();
    if(stem.length>125||q.ok.length>105)return;
    const sep=/[…:.]$/.test(stem)?" ":" ➜ ";
    const e=EMO[(ix*7)%EMO.length];
    out.push([stem+sep+q.ok,true,q.why,e]);
    const w=q.bad[ix%q.bad.length];
    if(w&&w.length<=105)out.push([stem+sep+w,false,"Lo correcto: «"+q.ok+"». "+q.why,e]);
  });
  return out;
}
let _vfall=null;
function allVF(){
  if(_vfall)return _vfall;
  const base=(typeof VF!=="undefined")?VF:[];const seen=new Set(base.map(x=>x[0]));const arr=base.slice();
  autoVF().forEach(x=>{if(!seen.has(x[0])){seen.add(x[0]);arr.push(x)}});
  return _vfall=arr;
}
let V=null;
function viewVF(){
  const N=allVF().length;
  if(!N){app.innerHTML='<div class="card res">Aún no hay V/F.</div>';return}
  app.innerHTML=`<div class="hero" style="padding-top:6px"><div class="emo">⚡</div><h1 style="font-size:clamp(1.7rem,6vw,2.3rem)">Verdadero <span>o falso</span></h1>
  <p><b>Desliza la tarjeta</b>: a la <b style="color:var(--accent)">derecha = VERDADERO ✓</b> · a la <b style="color:var(--red)">izquierda = FALSO ✗</b>. Sin esperas: cada frase trae su truco para que no se te olvide.</p>
  <div class="stats"><div class="pill"><div class="l">Frases</div><div class="v g">${N}</div></div><div class="pill"><div class="l">Mejor racha</div><div class="v y">${store.vfbest}</div></div><div class="pill"><div class="l">Por repasar</div><div class="v r">${store.vffail.length}</div></div></div>
  <div class="actions" style="flex-direction:column;align-items:center"><button class="big-btn play" id="vall">🏁 Todas de golpe (${N})</button><div class="row" style="justify-content:center"><button class="big-btn alt" id="v20">⚡ Ronda de 20</button><button class="big-btn alt" id="vsv">❤️ Supervivencia</button><button class="big-btn alt" id="vrev" ${store.vffail.length?"":"disabled"}>🔁 Mis fallos</button></div></div></div>`;
  $("#vall").onclick=()=>startVF("all");$("#v20").onclick=()=>startVF("20");$("#vsv").onclick=()=>startVF("surv");$("#vrev").onclick=()=>startVF("rev");
}
function startVF(mode){
  let pool=allVF().slice();
  if(mode==="rev")pool=pool.filter(v=>store.vffail.includes(v[0]));
  pool=shuffle(pool);if(mode==="20")pool=pool.slice(0,20);
  V={mode,q:pool,i:-1,lives:3,score:0,streak:0,best:0,xp:0,miss:[],lock:false,prev:null};
  app.innerHTML=`<div class="hud"><div class="pill"><div class="l">Frase</div><div class="v" id="vn">0/${pool.length}</div></div><div class="pill"><div class="l">${mode==="surv"?"Vidas":"Fallos"}</div><div class="v hearts" id="vl"></div></div><div class="pill"><div class="l">Racha</div><div class="v y" id="vs">🔥 0</div></div><div class="pill"><div class="l">Aciertos</div><div class="v g" id="vk">0</div></div><span class="sp"></span><button class="exit" id="vq">Salir</button></div>
  <div class="timebar"><i id="vp" style="width:0"></i></div>
  <div class="card vfcard" id="vc"></div>
  <div class="vfbtns"><button class="vfbtn f" id="bF">✗ Falso</button><button class="vfbtn t" id="bT">✓ Verdadero</button></div>
  <div class="kb">← FALSO · VERDADERO → · ¡desliza la tarjeta!</div>
  <div class="vfexp" id="vx"><div class="mut" style="text-align:center;font-size:.85rem">Aquí verás el truco de cada frase.</div></div>`;
  $("#vq").onclick=()=>go("vf");$("#bT").onclick=()=>answerVF(true);$("#bF").onclick=()=>answerVF(false);
  setupSwipe();nextVF();
}
function setupSwipe(){
  const c=$("#vc");let x0=null,dx=0,id=null;
  c.onpointerdown=e=>{if(V.lock)return;x0=e.clientX;dx=0;id=e.pointerId;c.setPointerCapture(id);c.style.transition="none"};
  c.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;const k=Math.min(1,Math.abs(dx)/90);const t=c.querySelector(".tag.t"),f=c.querySelector(".tag.f");if(t)t.style.opacity=dx>0?k:0;if(f)f.style.opacity=dx<0?k:0;c.style.borderColor=dx>0?"rgba(0,212,160,"+k+")":dx<0?"rgba(255,77,106,"+k+")":"";};
  const end=()=>{if(x0===null)return;const d=dx;x0=null;if(Math.abs(d)>85){answerVF(d>0)}else{c.style.transition="transform .25s,border-color .25s";c.style.transform="";c.style.borderColor="";c.querySelectorAll(".tag").forEach(t=>t.style.opacity=0)}};
  c.onpointerup=end;c.onpointercancel=end;
}
function vfHud(){
  const n=V.q.length;$("#vn").textContent=Math.min(V.i+1,n)+"/"+n;$("#vp").style.width=(V.i/n*100)+"%";
  $("#vl").textContent=V.mode==="surv"?"❤️".repeat(V.lives)+"🖤".repeat(3-V.lives):V.miss.length;
  $("#vs").textContent="🔥 "+V.streak;$("#vk").textContent=V.score;
}
function nextVF(){
  V.i++;
  if(V.i>=V.q.length||(V.mode==="surv"&&V.lives<=0))return endVF();
  const c=V.q[V.i],card=$("#vc");
  card.style.transition="none";card.style.transform="";card.style.opacity="1";card.style.borderColor="";
  card.innerHTML=`<div class="tag t">✓ VERDADERO</div><div class="tag f">✗ FALSO</div><div class="big">${c[3]||"🤔"}</div><div class="st">${esc(c[0])}</div>`;
  card.classList.remove("popin");void card.offsetWidth;card.classList.add("popin");
  V.lock=false;vfHud();
}
function answerVF(ans){
  if(!V||V.lock||V.i>=V.q.length)return;V.lock=true;
  const c=V.q[V.i],ok=ans===c[1],card=$("#vc");
  if(ok){
    V.score++;V.streak++;V.best=Math.max(V.best,V.streak);const g=1+Math.floor(Math.min(V.streak,10)/2);V.xp+=g;addXP(g);SFX.ok(V.streak);
    if(V.streak===5||V.streak%10===0){showBanner("RACHA x"+V.streak,"🔥 IMPARABLE");SFX.combo();burst(innerWidth/2,innerHeight/3,50)}
    store.vffail=store.vffail.filter(f=>f!==c[0]);
    $("#vx").innerHTML=`<div class="fb ok"><b class="t">✓ +${g} XP</b> <span class="mut">«${esc(c[0])}»</span><br>${esc(c[2])}</div>`;
  }else{
    V.lives--;V.streak=0;SFX.ko();if(navigator.vibrate)navigator.vibrate(90);
    if(!store.vffail.includes(c[0]))store.vffail.push(c[0]);V.miss.push(c);
    const vx=$("#vx");vx.innerHTML=`<div class="fb ko"><b class="t">✗ Era ${c[1]?"VERDADERO":"FALSO"}</b> <span class="mut">«${esc(c[0])}»</span><br>${esc(c[2])}</div>`;vx.classList.remove("shake");void vx.offsetWidth;vx.classList.add("shake");
  }
  if(V.score%25===0&&ok)store.vfbest=Math.max(store.vfbest,V.best);
  vfHud();save();
  card.style.transition=reduce?"none":"transform .2s ease-in,opacity .2s";
  card.style.transform=`translateX(${ans?140:-140}%) rotate(${ans?22:-22}deg)`;card.style.opacity="0";
  const my=V;setTimeout(()=>{if(V===my&&$("#vc"))nextVF()},reduce?0:210);
}
function endVF(){
  const total=V.i>V.q.length?V.q.length:V.i,sc=V.score,win=V.lives>0;
  store.vfbest=Math.max(store.vfbest,V.best);
  let bonus=0;if(win&&V.miss.length===0&&total>=10){bonus=40;addXP(40)}
  save();if(win){SFX.win();confetti(sc===total?260:140)}else SFX.lose();
  const pct=total?Math.round(sc/total*100):0;
  app.innerHTML=`<div class="card res"><div class="emo">${!win?"💀":V.miss.length?"🏆":"👑"}</div><h2 style="margin:8px 0 4px">${!win?"Te quedaste sin vidas":V.miss.length?"¡Ronda completada!":"¡PERFECTO!"}</h2>
  <div class="stats"><div class="pill"><div class="l">Aciertos</div><div class="v g">${sc}/${total}</div></div><div class="pill"><div class="l">Precisión</div><div class="v p">${pct}%</div></div><div class="pill"><div class="l">Mejor racha</div><div class="v y">${V.best}</div></div><div class="pill"><div class="l">XP</div><div class="v g">+${V.xp+bonus}</div></div></div>
  <p class="mut" style="margin-top:12px">${V.miss.length?"Las que se escaparon (se guardan en «Mis fallos»):":"Sin ningún fallo. ¡Bonus +40 XP!"}</p>
  <div class="actions"><button class="big-btn play" id="vagain">Otra vez</button><button class="big-btn alt" id="vmenu">Menú V/F</button></div></div>
  ${V.miss.slice(0,40).map(c=>`<div class="card" style="margin-bottom:10px"><div style="font-weight:600;margin-bottom:6px">${c[3]||"🤔"} ${esc(c[0])}</div><div class="fb ok"><b class="t">${c[1]?"VERDADERO":"FALSO"}</b><br>${esc(c[2])}</div></div>`).join("")}${V.miss.length>40?`<p class="mut">…y ${V.miss.length-40} más en «Mis fallos».</p>`:""}`;
  const m=V.mode;$("#vagain").onclick=()=>startVF(m);$("#vmenu").onclick=()=>go("vf");
}
document.addEventListener("keydown",e=>{
  if(!V||!$("#vc")||e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight")answerVF(true);else if(e.key==="ArrowLeft")answerVF(false);
});
go("home");
</script>
