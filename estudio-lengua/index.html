<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudio Lengua Castellana</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#141a35;--mut:#5b6280;--line:#e1e5f0;--acc:#00a9c0;--acc2:#007d93;--ok:#1b9a55;--okbg:#e4f6ec;--ko:#d6403a;--kobg:#fdeceb;--warn:#fff4dc;--shadow:0 2px 10px rgba(20,26,53,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1226;--card:#1a1f3d;--ink:#eef0fa;--mut:#a2a8c8;--line:#2c3260;--acc:#27c8dd;--acc2:#27c8dd;--ok:#4cd68a;--okbg:#12362a;--ko:#ff7a73;--kobg:#3b1c24;--warn:#3a3118;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:900px;margin:auto}
h1{margin:0;font-size:1.5rem}
header p{margin:2px 0 0;color:var(--mut);font-size:.95rem}
nav{display:flex;gap:6px;max-width:900px;margin:12px auto 0;padding:0 16px;flex-wrap:wrap}
nav button{flex:1;min-width:120px;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:900px;margin:16px auto 60px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc2)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.mut{color:var(--mut);font-size:.9rem}
.tag{display:inline-block;font-size:.75rem;font-weight:700;color:var(--acc2);text-transform:uppercase;letter-spacing:.04em}
/* tests */
.model{cursor:pointer;text-align:center}
.model:hover{border-color:var(--acc)}
.model b{font-size:1.1rem}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--bg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;border-left:5px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.ko{background:var(--kobg);border-color:var(--ko)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.score{font-size:2.4rem;font-weight:800}
/* flashcards */
.flash{perspective:1000px;margin:12px 0}
.flip{position:relative;height:260px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.front{background:var(--card);font-size:1.4rem;font-weight:700}
.back{background:#141a35;color:#fff;transform:rotateY(180deg);font-size:1.1rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{padding:5px 11px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
/* desarrollo */
textarea{width:100%;min-height:140px;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;resize:vertical}
.kw{display:inline-block;margin:3px 4px 3px 0;padding:3px 10px;border-radius:14px;font-size:.85rem;border:1px solid var(--line)}
.kw.has{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.kw.no{background:var(--kobg);border-color:var(--ko);color:var(--ko)}
.model-ans{background:var(--warn);padding:12px 14px;border-radius:10px;margin-top:10px;white-space:pre-line}
[hidden]{display:none!important}
</style>
</head>
<body>

  <button data-v="stats">📊 Progreso</button>
</nav>

Q("¿Cuáles son los mecanismos de cohesión?","Conectores textuales, elipsis, repetición y mecanismos referenciales",["Rima, ritmo y estrofa","Sinónimos y antónimos únicamente","Lexemas y morfemas"],"Son cuatro."),
Q("Los conectores textuales son…","Palabras del texto que indican la relación de unos enunciados con otros",["Palabras que riman","Las partes de una palabra","Los signos de puntuación"],"Hay varios tipos."),
Q("«En primer lugar», «después» y «por fin» son conectores…","De orden",["Aditivos","Explicativos","De contraste"],"Ordenan las ideas."),

Q("¿Para qué sirve la elipsis?","Para dar cohesión y evitar repeticiones que harían la lectura muy pesada",["Para alargar el texto","Para cambiar de tema","Para rimar"],"Hace presentes realidades sin nombrarlas."),

]},
{name:"3.1 · Constituyentes de la palabra",qs:[

{name:"4.3 · El género lírico y la métrica",qs:[

Q("La métrica estudia…","Los recursos utilizados por el autor de una obra lírica para conseguir ritmo y musicalidad",["Los personajes de un relato","El argumento de una obra","El origen de las palabras"],"Destacan la medida silábica, la rima, los acentos y las pausas."),

Q("La sinalefa se produce cuando…","Una palabra del interior de un verso termina en vocal y la siguiente empieza por vocal: forman una sola sílaba métrica",["Un diptongo se pronuncia en dos sílabas","Un hiato se pronuncia en una sílaba","La última palabra es esdrújula"],"Ejemplo: «Dichoso el humilde estado»."),

Q("La sinéresis es la licencia que permite…","Pronunciar en una sola sílaba un hiato («cae la nieve en remolino» = 8 sílabas)",["Pronunciar en dos sílabas un diptongo","Unir dos palabras","Sumar una sílaba"],"Licencia métrica."),

Q("En la rima consonante coinciden…","Las vocales y las consonantes (sola / ola)",["Solo las vocales","Solo las consonantes","Ninguna letra"],"Más completa que la asonante."),
Q("«Inquieto» y «pecho» tienen rima…","Asonante",["Consonante","Libre","Sin rima"],"Coinciden las vocales a partir de la última tónica (e-o)."),
Q("«Sola» y «ola» tienen rima…","Consonante",["Asonante","Libre","Sin rima"],"Coinciden vocales y consonantes."),
Q("La estrofa es…","Un conjunto de versos que forman una estructura fija en la medida silábica y en la rima, y que se repite a lo largo del poema",["Un verso suelto","Un conjunto de palabras","Una pausa"],"Se describe con un esquema métrico."),
Q("En el esquema métrico, los números expresan…","La medida de los versos",["La rima","La pausa","El acento"],"Las letras representan la rima."),
Q("En el esquema métrico, las letras minúsculas señalan…","Versos de arte menor",["Versos de arte mayor","Versos sin rima","Versos esdrújulos"],"Las mayúsculas señalan versos de arte mayor."),
Q("En el esquema métrico, las letras mayúsculas señalan…","Versos de arte mayor",["Versos de arte menor","Versos sin rima","Versos agudos"],"Las minúsculas señalan versos de arte menor."),
Q("Cuando un verso no rima con ningún otro, en el esquema se indica con…","Una raya",["Una letra mayúscula","Una letra minúscula","Un número"],"Versos que tienen la misma rima se marcan con la misma letra."),
]},

Q("¿Cuál es el desenlace de una comedia?","Feliz",["Trágico","Triste","Violento"],"Pretende provocar la risa."),

const CARDS=[
["Texto","Unidad máxima de comunicación. Compuesto de uno o más enunciados relacionados entre sí y con un sentido completo.","2. El texto"],
["Propiedades del texto","Coherencia, adecuación y cohesión: le dan unidad y sentido y permiten interpretarlo correctamente.","2. El texto"],
["Clases de textos (intención del autor)","Narrativo · Descriptivo · Dialogado · Expositivo · Argumentativo · Prescriptivo.","2. El texto"],
["Coherencia","Un texto es coherente si está ordenado y todas sus partes están ligadas entre sí y con el tema principal. En relación consigo mismo: enunciados vinculados, relación lógica, sin contradicciones y con un orden. En relación con el mundo: responde a nuestra experiencia.","2. El texto"],
["Adecuación","Se emite teniendo en cuenta las circunstancias: finalidad (no usar palabras informales para pedir un cambio de examen), personas que lo reciben (no lenguaje literario con amigos) y lugar (no usar el móvil en un concierto).","2. El texto"],
["Cohesión","Propiedad que ayuda a percibir su unidad y coherencia. Mecanismos: conectores textuales, elipsis, repetición y mecanismos referenciales.","2. El texto"],
["Conectores (1)","De orden: en primer lugar, después, por fin · Aditivos: además, asimismo, también, encima, incluso · Explicativos: o sea, esto es, es decir, a saber.","2. El texto"],
["Conectores (2)","De contraste: sin embargo, antes bien, en cambio · Consecutivos: por tanto, por consiguiente, de ahí que, pues · Ejemplificativos: así, por ejemplo · De rectificación: mejor dicho, más bien.","2. El texto"],
["Elipsis","Suprimir partes del texto que el receptor conoce. Da cohesión y evita repeticiones. Ej.: «Yo pasaré las vacaciones en la playa, y ella, en la montaña» (= pasará las vacaciones).","2. El texto"],
["Repetición","Cohesiona porque transmite la sensación de hablar siempre del mismo tema. También: campo semántico (hiperónimo e hipónimos), sinónimos y antónimos.","2. El texto"],
["Mecanismos referenciales","Expresiones que se refieren a lo mismo: palabras que se refieren a una misma realidad (Lisboa / la capital de Portugal), pronombres que sustituyen a sustantivos (él) y determinantes posesivos (su).","2. El texto"],
["Palabra","Conjunto de sonidos asociado a un significado, que en la escritura aparece entre dos espacios en blanco.","3. La palabra"],
["Invariables y variables","Invariables: adverbios, preposiciones, interjecciones y conjunciones (no cambian). Variables: nombres, pronombres, determinantes, adjetivos y verbos (cambian de género, número, persona, tiempo y modo).","3. La palabra"],
["Lexema y morfemas","Lexema o raíz: significado fundamental (dos raíces = palabra compuesta). Morfemas: flexivos (desinencias, al final: género, número, persona, tiempo, modo) y derivativos (prefijos antes del lexema, sufijos después).","3. La palabra"],
["Análisis morfológico","1) Localizar el lexema. 2) Señalar los morfemas derivativos (prefijos y sufijos). 3) Identificar si hay morfemas flexivos.","3. La palabra"],
["Palabras simples, compuestas y derivadas","Simples: un solo lexema (ratón). Compuestas: dos o más voces (sacapuntas). Derivadas: prefijos o sufijos (pescadera, inútil). Parasintéticas: composición y derivación a la vez (sietemesina, picapedrero).","3. La palabra"],
["Sufijos y categoría","Los sufijos pueden cambiar la categoría: nombre (vivir > vivienda), adjetivo (vapor > vaporoso), verbo (amarillo > amarillear), adverbio (sincero > sinceramente).","3. La palabra"],
["Siglas","Letras iniciales de varias palabras (UE). Se escriben con mayúsculas, sin puntos ni espacios y no se separan a final de línea (BCE, ONG).","3. La palabra"],
["Acrónimos","Unión de fragmentos de dos o más palabras (informática) o siglas que se pronuncian como una palabra (sida). Llevan tilde si lo indican las reglas de acentuación; si son nombres propios, inicial mayúscula (Unicef).","3. La palabra"],
["Acortamientos y abreviaturas","Acortamientos: recortes de palabras (profe, bici, foto, bus). Abreviaturas: supresión de letras en la escritura (Dra., D.); se escriben con punto y llevan tilde si la palabra abreviada la lleva (pág.).","3. La palabra"],
["Composición culta","Raíces de origen griego o latino: biblio (libro) + teca (lugar) → biblioteca. mega- (grande), tele- (a distancia), neuro- (nervio), bio- (vida), -fono (voz), -grafía (escritura), -algia (dolor), -patía (dolencia).","3. La palabra"],
["Sinónimos y antónimos","Sinónimos: significado igual o parecido (alto-elevado). Antónimos: significados contrarios (día-noche); se forman con a-, i-, in-, im-, des-, anti-.","3. La palabra"],
["Hiperónimos e hipónimos","Hiperónimo: significado general que incluye otros más concretos (calzado). Hipónimos: zapato, zapatillas, sandalia, bota, botín. Constituyen un campo semántico.","3. La palabra"],
["Denotación y connotación","Denotativo: significado literal (león = animal carnívoro…). Connotativo: contenidos y valoraciones que sugiere (león = valentía).","3. La palabra"],
["Géneros literarios","Grupos en los que se clasifican las obras literarias por su función y estructura. Tradicionalmente: narrativo, lírico y teatral o dramático. Desde el siglo XVIII también el didáctico.","4. Géneros literarios"],
["Género narrativo","Un narrador cuenta lo que les ocurre a unos personajes en un tiempo y un espacio. Primero en verso (épica), después en prosa.","4. Géneros literarios"],
["Épica: epopeya","Poema extenso de la Antigüedad con héroes de importancia histórica y dioses. Ej.: Ilíada y Odisea (Homero), Eneida (Virgilio).","4. Géneros literarios"],
["Épica: cantar de gesta y romances","Cantar de gesta: poema épico medieval sobre las hazañas de un héroe (Cantar de Mio Cid). Romances: poemas narrativos breves, populares en España desde el siglo XV.","4. Géneros literarios"],
["Narrativa en prosa","Novela (extensa) · Cuento (breve; si es didáctico, apólogo) · Microrrelato (hasta veinte líneas) · Novela corta (intermedia) · Leyenda (relato extraordinario de la tradición).","4. Géneros literarios"],
["Género lírico","Obras escritas generalmente en verso en las que se expresan sentimientos y emociones con un lenguaje cuidado.","4. Géneros literarios"],
["Subgéneros líricos","Sátira: censura vicios con humor (Quevedo) · Oda: amor, tristeza o cosas cotidianas (Manuel Machado) · Elegía: dolor por la muerte de un ser querido (Miguel Hernández) · Égloga: amor en boca de pastores (Garcilaso).","4. Géneros literarios"],
["Métrica","Estudia los recursos para conseguir ritmo y musicalidad: medida silábica, rima, acentos y pausas. Arte mayor: más de 8 sílabas; arte menor: 8 o menos.","4. Géneros literarios"],
["Cómputo silábico","Sinalefa: vocal final + vocal inicial = una sílaba. Acento: aguda suma una sílaba; esdrújula resta una. Diéresis: diptongo en dos sílabas. Sinéresis: hiato en una sílaba.","4. Géneros literarios"],
["Rima","Identidad o semejanza de sonidos al final de dos o más versos desde la última vocal tónica. Asonante: solo vocales (inquieto/pecho). Consonante: vocales y consonantes (sola/ola).","4. Géneros literarios"],
["Estrofa y esquema métrico","Estrofa: conjunto de versos con estructura fija en medida y rima. Esquema: números = medida; letras = rima (minúscula: arte menor; mayúscula: arte mayor); raya = verso suelto.","4. Géneros literarios"],
["Género teatral o dramático","Obras dialogadas concebidas para ser representadas en escena por actores. Mayores: tragedia, comedia, drama. Menores: auto sacramental, entremés, sainete.","4. Géneros literarios"],
["Tragedia, comedia y drama","Tragedia: nobles contra un destino adverso, final trágico. Comedia: alegre, provoca risa, final feliz. Drama: tono menos elevado, final trágico; con elementos cómicos = tragicomedia.","4. Géneros literarios"],
["Géneros teatrales menores","Auto sacramental: breve, alegórico y religioso. Entremés: breve y cómico, en los entreactos. Sainete: cómico breve, ambientes populares, burlesco y satírico.","4. Géneros literarios"],

{q:"Explica qué es la coherencia y pon ejemplos de textos coherentes e incoherentes.",

{q:"Explica los tipos de conectores textuales y pon ejemplos.",

{q:"Explica la estructura de las palabras variables (lexema y morfemas) con ejemplos y los pasos del análisis morfológico.",

{q:"Explica los mecanismos de formación de palabras: composición, derivación, parasíntesis, siglas, acrónimos y abreviaciones.",

 kw:[["narrador"],["personajes"],["epica"],["epopeya","iliada","odisea"],["cantar de gesta","mio cid"],["romances"],["novela"],["cuento"],["microrrelato"],["leyenda"]]},
{q:"Explica el género lírico: subgéneros y recursos de la métrica (medida, rima y estrofa).",
 ans:"El género lírico agrupa obras generalmente en verso en las que el autor expresa sentimientos y emociones. Subgéneros: sátira (censura vicios con humor), oda (amor, tristeza o cosas cotidianas), elegía (dolor por la muerte de un ser querido) y égloga (amor en boca de pastores). La métrica estudia el ritmo: medida silábica (arte menor, 8 o menos; arte mayor, más de 8; con sinalefa, acento, diéresis y sinéresis), rima (asonante: vocales; consonante: vocales y consonantes) y estrofa (conjunto de versos con estructura fija, descrita con un esquema métrico).",
 kw:[["sentimientos","emociones"],["satira"],["oda"],["elegia"],["egloga"],["metrica"],["arte menor","arte mayor"],["sinalefa"],["rima"],["asonante","consonante"],["estrofa"]]},
{q:"Explica el género teatral: géneros mayores y menores.",
 ans:"El género teatral o dramático está formado por obras dialogadas concebidas para ser representadas por actores. Mayores: tragedia (personajes nobles que luchan contra un destino adverso, desenlace trágico), comedia (alegre y humorística, desenlace feliz) y drama (conflictos de tono menos elevado, final trágico; si incluye elementos cómicos, tragicomedia). Menores: auto sacramental (breve, alegórico y religioso), entremés (breve y cómico, en los entreactos) y sainete (cómico breve, ambientes populares, burlesco y satírico).",
 kw:[["dialogadas","actores","representadas"],["tragedia"],["comedia"],["drama"],["tragicomedia"],["auto sacramental"],["entremes"],["sainete"],["mayores","menores"]]},
];

/* ============ UTILIDADES ============ */
const $=s=>document.querySelector(s);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let store={};
try{store=JSON.parse(localStorage.getItem("estudioLen")||"{}")}catch(e){}
store.tests=store.tests||{};store.known=store.known||{};
const save=()=>{try{localStorage.setItem("estudioLen",JSON.stringify(store))}catch(e){}};

const app=$("#app");
function view(v){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  ({tests:viewTests,cards:viewCards,dev:viewDev,stats:viewStats})[v]();
  window.scrollTo(0,0);
}
$("#nav").onclick=e=>{if(e.target.dataset.v)view(e.target.dataset.v)};

/* ============ TESTS ============ */
let T=null;
function viewTests(){
  const best=(k,n)=>{const r=store.tests[k];return r?`Mejor: ${r.best}/${r.n||n}`:"Sin hacer"};
  app.innerHTML=`<div class="card"><b>Elige un test</b>
    <p class="mut">Si fallas, te mostramos la respuesta correcta y por qué.</p>
    <label class="row"><input type="checkbox" id="exam"> <span><b>Modo examen</b>: sin feedback hasta el final (la corrección con explicaciones sale al terminar)</span></label>
  </div>
  <h3>Por apartados (largos)</h3>
  <div class="grid">${TOPICS.map((m,i)=>`<div class="card model" data-m="t${i}"><b>📚 ${esc(m.name)}</b><div class="mut">${m.qs.length} preguntas</div><div class="mut">${best("mt"+i,m.qs.length)}</div></div>`).join("")}</div>
  <h3>Modelos de examen</h3>
  <div class="grid">${MODELS.map((m,i)=>`<div class="card model" data-m="${i}"><b>📝 ${m.name}</b><div class="mut">${m.qs.length} preguntas</div><div class="mut">${best("m"+i,m.qs.length)}</div></div>`).join("")}
  <div class="card model" data-m="mix"><b>🎲 Mixto</b><div class="mut">20 preguntas al azar de todos los tests</div></div>
  <div class="card model" data-m="fails"><b>🔁 Repasar fallos</b><div class="mut">${(store.fails||[]).length} preguntas falladas guardadas</div></div></div>`;
  app.onclick=e=>{const c=e.target.closest(".model");if(!c)return;startTest(c.dataset.m,$("#exam").checked)};
}
function startTest(m,exam){
  let qs,name;
  const all=[...MODELS,...TOPICS].flatMap(x=>x.qs);
  if(m==="mix"){qs=shuffle(all).slice(0,20);name="Mixto"}
  else if(m==="fails"){qs=all.filter(q=>(store.fails||[]).includes(q.q));name="Repaso de fallos";if(!qs.length){alert("¡No tienes fallos guardados! 🎉");return}}
  else if(m[0]==="t"){const t=TOPICS[+m.slice(1)];qs=t.qs.slice();name=t.name}
  else{qs=MODELS[+m].qs.slice();name=MODELS[+m].name}
  qs=shuffle(qs).map(q=>({...q,opts:shuffle([q.ok,...q.bad])}));
  T={m,name,exam,qs,i:0,ans:[],locked:false};
  renderQ();
}
function renderQ(){
  const q=T.qs[T.i],n=T.qs.length;
  app.innerHTML=`<div class="card"><div class="row"><span class="tag">${T.name}${T.exam?" · modo examen":""}</span><span class="sp"></span><span class="mut">${T.i+1}/${n}</span></div>
  <div class="bar"><i style="width:${T.i/n*100}%"></i></div>
  <h3 style="margin:0 0 10px">${esc(q.q)}</h3>
  <div id="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
  <div id="fb"></div>
  <div class="row" style="margin-top:14px"><button class="btn ghost" id="quit">Salir</button><span class="sp"></span><button class="btn" id="next" hidden></button></div></div>`;
  T.locked=false;
  $("#quit").onclick=()=>{if(confirm("¿Salir del test? Se perderá el progreso."))viewTests()};
  $("#opts").onclick=e=>{const b=e.target.closest(".opt");if(!b||T.locked&&!T.exam)return;pick(+b.dataset.k)};
  $("#next").onclick=()=>{if(T.i+1<n){T.i++;renderQ()}else finish()};
}
function pick(k){
  const q=T.qs[T.i];T.ans[T.i]=k;
  const next=$("#next");next.hidden=false;next.textContent=T.i+1<T.qs.length?"Siguiente →":"Ver resultado";
  const btns=[...document.querySelectorAll(".opt")];
  if(T.exam){btns.forEach((b,j)=>b.classList.toggle("sel",j===k));return}
  T.locked=true;
  const good=q.opts[k]===q.ok;
  btns.forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.ok)b.classList.add("ok");else if(j===k)b.classList.add("ko")});
  $("#fb").innerHTML=good
   ?`<div class="fb ok"><b>✅ ¡Correcto!</b><br>${esc(q.why)}</div>`
   :`<div class="fb ko"><b>❌ Has fallado.</b> La respuesta correcta es:<br><b>${esc(q.ok)}</b><br><br><b>¿Por qué?</b> ${esc(q.why)}</div>`;
}
function finish(){
  const n=T.qs.length;
  const wrong=T.qs.filter((q,i)=>q.opts[T.ans[i]]!==q.ok);
  const sc=n-wrong.length;
  store.fails=(store.fails||[]).filter(f=>!T.qs.some(q=>q.q===f));
  wrong.forEach(q=>store.fails.push(q.q));
  const key="m"+T.m;const r=store.tests[key]||{best:0,tries:0};
  r.tries++;r.best=Math.max(r.best,sc);r.last=sc;r.n=n;store.tests[key]=r;
  store.hist=(store.hist||[]).concat({name:T.name,sc,n,d:new Date().toLocaleDateString("es-ES")}).slice(-30);
  save();
  const nota=(sc/n*10).toFixed(1);
  app.innerHTML=`<div class="card" style="text-align:center"><span class="tag">${T.name}</span>
   <div class="score">${sc}/${n} · ${nota}</div>
   <p>${sc===n?"🏆 ¡Perfecto!":sc/n>=.5?"👍 ¡Aprobado! Repasa los fallos:":"💪 A repasar un poco más:"}</p>
   <div class="row" style="justify-content:center"><button class="btn" id="again">Repetir</button><button class="btn ghost" id="back">Menú</button></div></div>
   ${wrong.length?`<h3>Tus fallos (${wrong.length})</h3>`+wrong.map(q=>`<div class="card"><b>${esc(q.q)}</b>
     <div class="fb ko" style="margin-top:8px">Tu respuesta: ${esc(q.opts[T.ans[T.qs.indexOf(q)]]??"(en blanco)")}</div>
     <div class="fb ok" style="margin-top:8px"><b>Correcta:</b> ${esc(q.ok)}<br><b>Porque:</b> ${esc(q.why)}</div></div>`).join(""):""}`;
  $("#again").onclick=()=>startTest(T.m,T.exam);
  $("#back").onclick=viewTests;
}

/* ============ TARJETAS ============ */
let C={sec:"Todas",pool:[],i:0,onlyReview:false};
function viewCards(){
  const secs=["Todas",...new Set(CARDS.map(c=>c[2]))];
  const pool=()=>CARDS.map((c,id)=>({c,id})).filter(x=>(C.sec==="Todas"||x.c[2]===C.sec)&&(!C.onlyReview||!store.known[x.id]));
  C.pool=pool();if(C.i>=C.pool.length)C.i=0;
  const cur=C.pool[C.i];
  const knownN=Object.values(store.known).filter(Boolean).length;
  app.innerHTML=`<div class="chips">${secs.map(s=>`<button class="chip ${s===C.sec?"on":""}" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
  <div class="row"><label class="mut"><input type="checkbox" id="rev" ${C.onlyReview?"checked":""}> Solo las que aún no sé</label><span class="sp"></span><span class="mut">Dominadas: ${knownN}/${CARDS.length}</span></div>
  ${cur?`<div class="flash"><div class="flip" id="flip"><div class="face front">${esc(cur.c[0])}<div class="mut" style="font-weight:400;font-size:.8rem;margin-top:10px">toca para girar</div></div><div class="face back">${esc(cur.c[1])}</div></div></div>
  <div class="row"><button class="btn ghost" id="prev">←</button><span class="mut">${C.i+1}/${C.pool.length}</span><button class="btn ghost" id="nx">→</button><span class="sp"></span>
   <button class="btn ghost" id="rv">🔁 Repasar</button><button class="btn" id="kn">✅ Me la sé</button></div>
  <div class="row" style="margin-top:10px"><button class="btn ghost" id="sh">🔀 Barajar</button></div>`
  :`<div class="card">🎉 No quedan tarjetas pendientes en esta selección.</div>`}`;
  app.onclick=e=>{const ch=e.target.closest(".chip");if(ch){C.sec=ch.dataset.s;C.i=0;viewCards()}};
  $("#rev").onchange=e=>{C.onlyReview=e.target.checked;C.i=0;viewCards()};
  if(!cur)return;
  $("#flip").onclick=()=>$("#flip").classList.toggle("on");
  const go=d=>{C.i=(C.i+d+C.pool.length)%C.pool.length;viewCards()};
  $("#prev").onclick=()=>go(-1);$("#nx").onclick=()=>go(1);
  $("#kn").onclick=()=>{store.known[cur.id]=true;save();C.pool=pool();if(!C.onlyReview)C.i=(C.i+1)%C.pool.length;viewCards()};
  $("#rv").onclick=()=>{store.known[cur.id]=false;save();go(1)};
  $("#sh").onclick=()=>{C.i=Math.floor(Math.random()*C.pool.length);viewCards()};
}

/* ============ DESARROLLO ============ */
let D={i:0,checked:false};
function viewDev(){
  const d=DEV[D.i];
  app.innerHTML=`<div class="card"><div class="row"><span class="tag">Pregunta de desarrollo</span><span class="sp"></span><span class="mut">${D.i+1}/${DEV.length}</span></div>
  <h3 style="margin:8px 0">${esc(d.q)}</h3>
  <textarea id="txt" placeholder="Escribe aquí tu respuesta…">${esc(store["dev"+D.i]||"")}</textarea>
  <div class="row" style="margin-top:10px"><button class="btn ghost" id="p">←</button><button class="btn ghost" id="n">→</button><span class="sp"></span><button class="btn" id="chk">Comprobar</button></div>
  <div id="res"></div></div>`;
  $("#txt").oninput=e=>{store["dev"+D.i]=e.target.value;save()};
  $("#p").onclick=()=>{D.i=(D.i+DEV.length-1)%DEV.length;viewDev()};
  $("#n").onclick=()=>{D.i=(D.i+1)%DEV.length;viewDev()};
  $("#chk").onclick=()=>{
    const t=norm($("#txt").value);
    const hits=d.kw.map(g=>g.some(w=>t.includes(norm(w))));
    const ok=hits.filter(Boolean).length;
    $("#res").innerHTML=`<p><b>Conceptos clave detectados: ${ok}/${d.kw.length}</b></p>
    <div>${d.kw.map((g,i)=>`<span class="kw ${hits[i]?"has":"no"}">${hits[i]?"✓":"✗"} ${esc(g[0])}</span>`).join("")}</div>
    <p class="mut">Es una detección automática por palabras: si lo explicaste con otras palabras, compara con la respuesta modelo.</p>
    <div class="model-ans"><b>Respuesta modelo</b>\n${esc(d.ans)}</div>`;
  };
}

/* ============ PROGRESO ============ */
function viewStats(){
  const k=Object.values(store.known).filter(Boolean).length;
  app.innerHTML=`<div class="grid">
   <div class="card"><span class="tag">Tarjetas dominadas</span><div class="score">${k}/${CARDS.length}</div></div>
   <div class="card"><span class="tag">Preguntas por repasar</span><div class="score">${(store.fails||[]).length}</div></div></div>
  <div class="card"><b>Tests por apartado</b>${TOPICS.map((m,i)=>{const r=store.tests["mt"+i];return `<p>${esc(m.name)}: ${r?`mejor ${r.best}/${r.n} · último ${r.last}/${r.n} · ${r.tries} intento(s)`:"sin hacer"}</p>`}).join("")}</div>
  <div class="card"><b>Modelos de test</b>${MODELS.map((m,i)=>{const r=store.tests["m"+i];return `<p>${m.name}: ${r?`mejor ${r.best}/${r.n} · último ${r.last}/${r.n} · ${r.tries} intento(s)`:"sin hacer"}</p>`}).join("")}</div>
  <div class="card"><b>Últimos intentos</b>${(store.hist||[]).slice().reverse().slice(0,10).map(h=>`<p class="mut">${h.d} · ${esc(h.name)} · ${h.sc}/${h.n}</p>`).join("")||'<p class="mut">Todavía no hay intentos.</p>'}</div>
  <button class="btn ghost" id="rst">Borrar progreso</button>`;
  $("#rst").onclick=()=>{if(confirm("¿Borrar todo el progreso?")){store={tests:{},known:{}};save();viewStats()}};
}
view("tests");
</script>
</body>
</html>
